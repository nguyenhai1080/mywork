<script>
function consumptionState_(){if(!STATE.consumption)STATE.consumption={year:new Date().getFullYear(),month:new Date().getMonth()+1,marketId:'',view:'MONTH',status:'ALL',loading:false};return STATE.consumption;}
async function loadConsumption_(){const c=consumptionState_();c.loading=true;c.error='';try{c.data=await serverCall_('apiConsumptionBootstrap');}catch(e){c.error=e.message;}finally{c.loading=false;if(STATE.page==='consumption')renderCurrentPage_();}}
function mcNum_(v){return v===''||v==null?'—':Number(v).toLocaleString('en-US',{maximumFractionDigits:2});}
function mcPct_(v){return v===''||v==null?'—':Number(v).toFixed(1)+'%';}
function mcGrowth_(a,b){return a==null||b==null||b===0?null:(a/b-1)*100;}
function mcAggregate_(records,id,year,months,scenario,status){
 const monthly=records.filter(r=>r.MarketID===id&&Number(r.Year)===Number(year)&&months.includes(Number(r.Month))&&r.Scenario===scenario&&(status!=='FINAL'||r.Status==='FINAL'));
 let selected=monthly,annual=false;
 if(months.length===12&&!monthly.length){selected=records.filter(r=>r.MarketID===id&&Number(r.Year)===Number(year)&&Number(r.Month)===0&&r.Scenario===scenario&&(status!=='FINAL'||r.Status==='FINAL'));annual=selected.length>0;}
 const expected=annual?1:months.length,result={count:monthly.length,annual:annual,expected:expected,draft:selected.some(r=>r.Status==='DRAFT'),mismatch:selected.some(r=>r.Reconciliation==='MISMATCH')};
 for(const k of ['Total','Voice','SMS','Data','VAS']){const values=selected.filter(r=>r[k]!==''&&r[k]!=null);result[k]=values.length===expected?values.reduce((s,r)=>s+Number(r[k]),0):null;result[k+'Available']=values.length?values.reduce((s,r)=>s+Number(r[k]),0):null;}
 result.complete=result.Total!==null;result.DataShare=result.Total>0&&result.Data!==null?result.Data/result.Total*100:null;return result;
}
function mcReportRows_(c){const months=c.view==='MONTH'?[Number(c.month)]:Array.from({length:Number(c.month)},(_,i)=>i+1);return c.data.markets.filter(m=>!c.marketId||m.MarketID===c.marketId).filter(m=>!String(m.ShortName).startsWith('TEST')).map(m=>{const a=mcAggregate_(c.data.records,m.MarketID,c.year,months,'ACTUAL',c.status),p=mcAggregate_(c.data.records,m.MarketID,c.year,months,'PLAN',c.status),y=mcAggregate_(c.data.records,m.MarketID,c.year-1,months,'ACTUAL',c.status);const previousYear=Number(c.month)===1?Number(c.year)-1:Number(c.year),previousMonth=Number(c.month)===1?12:Number(c.month)-1;const prev=c.view==='MONTH'?mcAggregate_(c.data.records,m.MarketID,previousYear,[previousMonth],'ACTUAL',c.status):null;return {market:m,actual:a,plan:p,yoy:mcGrowth_(a.Total,y.Total),mom:prev?mcGrowth_(a.Total,prev.Total):null,achievement:a.Total!==null&&p.Total>0?a.Total/p.Total*100:null};});}
function mcOptions_(values,current){return values.map(v=>'<option value="'+escapeHtmlAttr_(v[0])+'" '+(String(v[0])===String(current)?'selected':'')+'>'+escapeHtml_(v[1])+'</option>').join('');}
function renderConsumption_(){const c=consumptionState_();if(c.error)return '<div class="empty-state">'+escapeHtml_(c.error)+'<button data-action="mc-refresh">Thử lại</button></div>';if(!c.data)return renderLoading_('Đang tải tiêu dùng di động...');if(!c.data.ready)return '<div class="empty-state"><h2>Tiêu dùng di động</h2><p>Đơn vị: nghìn USD</p><button class="primary-btn" data-action="mc-init">Bắt đầu</button></div>';
 if(c.marketId==='__VTG__')return mcVTGPage_(c);const rows=mcReportRows_(c);return mcToolbar_(c)+'<div class="productivity-toolbar-v2"><p>Đơn vị: <strong>nghìn USD</strong>. '+(c.view==='YEAR'?'Lũy kế T1–T'+c.month:'Tháng '+c.month)+'/'+c.year+'</p><div><button class="secondary-btn" data-action="mc-import">Nhập nhiều kỳ</button> <button class="secondary-btn" data-action="mc-export">Xuất CSV</button> <button class="primary-btn" data-action="mc-new">+ Nhập tháng</button></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Thị trường</th><th>Thực hiện</th><th>Kế hoạch</th><th>HTKH</th><th>MoM</th><th>YoY</th><th>Data</th><th>Tỷ trọng Data</th><th>Dữ liệu</th></tr></thead><tbody>'+rows.map(r=>'<tr><td><button class="table-link" data-action="mc-detail" data-market-id="'+escapeHtmlAttr_(r.market.MarketID)+'">'+escapeHtml_(r.market.ShortName)+'</button></td><td>'+mcNum_(r.actual.Total)+'</td><td>'+mcNum_(r.plan.Total)+'</td><td>'+mcPct_(r.achievement)+'</td><td>'+mcPct_(r.mom)+'</td><td>'+mcPct_(r.yoy)+'</td><td>'+mcNum_(r.actual.Data)+'</td><td>'+mcPct_(r.actual.DataShare)+'</td><td>'+(r.actual.annual?'Chỉ có tổng năm':r.actual.count+'/'+(c.view==='MONTH'?1:c.month)+' tháng')+(r.actual.draft?' · Nháp':'')+(r.actual.mismatch?' · ⚠ Cơ cấu chưa khớp':'')+'</td></tr>').join('')+'</tbody></table></div><p class="work-context">“—” = chưa đủ dữ liệu hoặc không có mẫu số để so sánh. Tháng thiếu không được coi là 0. Tổng gốc được giữ nguyên; cơ cấu lệch được đánh dấu và chưa thể chốt. Báo cáo cả năm có thể dùng số tổng năm lịch sử khi hoàn toàn chưa có số tháng.</p>'+mcTotalHtml_(rows)+ (c.marketId?mcYearHtml_(c):'');}
function mcTotalHtml_(rows){const available=rows.filter(r=>r.actual.Total!==null),total=available.reduce((s,r)=>s+r.actual.Total,0);return '<p><strong>'+(available.length===rows.length?'Tổng các thị trường':'Tổng các thị trường đủ kỳ')+': '+(available.length?mcNum_(total):'—')+'</strong> nghìn USD · '+available.length+'/'+rows.length+' thị trường đủ dữ liệu.</p>';}
function mcYearHtml_(c){const list=Array.from({length:12},(_,i)=>{const r=c.data.records.find(r=>r.MarketID===c.marketId&&Number(r.Year)===Number(c.year)&&Number(r.Month)===i+1&&r.Scenario==='ACTUAL'&&(c.status!=='FINAL'||r.Status==='FINAL'));return {month:i+1,r:r};});const max=Math.max(1,...list.map(x=>x.r?Number(x.r.Total)||0:0));return '<h2>Chi tiết 12 tháng · '+c.year+'</h2><div class="mc-trend" aria-label="Xu hướng tổng tiêu dùng">'+list.map(x=>'<div class="mc-bar-column"><span>'+mcNum_(x.r?x.r.Total:null)+'</span><div class="mc-bar" style="height:'+(x.r&&x.r.Total!==''?Math.max(2,100*Number(x.r.Total)/max):0)+'px"></div><span>T'+x.month+'</span></div>').join('')+'</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Tháng</th><th>Tổng</th><th>Thoại</th><th>SMS</th><th>Data</th><th>VAS</th><th>Tỷ trọng Data</th><th>Trạng thái</th><th></th></tr></thead><tbody>'+list.map(x=>{const r=x.r||{};return '<tr><td>T'+x.month+'</td><td>'+mcNum_(r.Total)+'</td><td>'+mcNum_(r.Voice)+'</td><td>'+mcNum_(r.SMS)+'</td><td>'+mcNum_(r.Data)+'</td><td>'+mcNum_(r.VAS)+'</td><td>'+mcPct_(r.Total>0&&r.Data!==''?r.Data/r.Total*100:null)+'</td><td>'+escapeHtml_(r.Status||'Chưa nhập')+(r.Reconciliation==='MISMATCH'?' · ⚠ Cơ cấu chưa khớp':'')+'</td><td><button class="ghost-btn" data-action="mc-edit" data-month="'+x.month+'">Nhập / sửa</button>'+(r.RecordID?'<button class="ghost-btn" data-action="mc-history" data-record-id="'+escapeHtmlAttr_(r.RecordID)+'">Lịch sử</button>':'')+'</td></tr>';}).join('')+'</tbody></table></div>';}
function mcInput_(name,value,type,extra){return '<input name="'+name+'" type="'+(type||'number')+'" value="'+escapeHtmlAttr_(value==null?'':String(value))+'" '+(extra||'step="any" min="0"')+'>';}
function mcOpen_(month){const c=consumptionState_();c.editScenario='ACTUAL';c.editMonth=Number(month||c.month);mcForm_();}
function mcForm_(){const c=consumptionState_(),group=c.marketId==='__VTG__',marketId=group?'VTG':c.marketId,records=group?(c.data.vtgRecords||[]):c.data.records,r=records.find(r=>r.MarketID===marketId&&Number(r.Year)===Number(c.year)&&Number(r.Month)===c.editMonth&&r.Scenario===c.editScenario)||{};c.editRevision=r.Revision||0;
 showModal_('Nhập tiêu dùng · nghìn USD','<form id="mc-form" class="form-stack" onsubmit="return false;"><div class="form-grid-2">'+formField_('Thị trường','<select name="marketId" id="mc-form-market">'+mcOptions_((group?[{MarketID:'VTG',ShortName:'VTG',Country:'Công ty mẹ'}]:c.data.markets.filter(m=>!String(m.ShortName).startsWith('TEST'))).map(m=>[m.MarketID,m.ShortName+' · '+m.Country]),marketId)+'</select>')+formField_('Loại số liệu','<select name="scenario" id="mc-form-scenario">'+mcOptions_([['ACTUAL','Thực hiện'],['PLAN','Kế hoạch']],c.editScenario)+'</select>')+'</div><p>T'+c.editMonth+'/'+c.year+'</p>'+formField_('Cách nhập','<select name="inputMode" id="mc-mode">'+mcOptions_([['AMOUNTS','Giá trị từng dịch vụ'],['SHARES','Tổng và tỷ trọng (%)']],r.InputMode||'AMOUNTS')+'</select>')+formField_('Tổng gốc (để trống để cộng 4 dịch vụ)',mcInput_('total',r.Total))+'<div class="form-grid-2">'+['Voice','SMS','Data','VAS'].map((k,i)=>formField_(['Thoại','SMS','Data','VAS'][i],mcInput_(k.toLowerCase(),r[k]))).join('')+'</div><div class="form-grid-2">'+['Voice','SMS','Data','VAS'].map((k,i)=>formField_(['% Thoại','% SMS','% Data','% VAS'][i],mcInput_(k.toLowerCase()+'Share',r[k+'Share'],'number','min="0" max="100" step="any"'))).join('')+'</div>'+formField_('Trạng thái','<select name="status">'+mcOptions_([['DRAFT','Nháp'],['FINAL','Đã chốt']],r.Status||'DRAFT')+'</select>')+formField_('Nguồn',mcInput_('source',r.Source,'text','maxlength="2000"'))+formField_('Ghi chú',mcInput_('note',r.Note,'text','maxlength="2000"'))+formField_('Lý do chỉnh sửa kỳ đã chốt',mcInput_('changeReason','','text','maxlength="2000"'))+'</form>',[{label:'Hủy',className:'ghost-btn',close:true},{label:'Lưu',className:'primary-btn',action:'mc-save'}]);mcMode_();}
function mcMode_(){const f=document.getElementById('mc-form');if(!f)return;const shares=f.elements.inputMode.value==='SHARES';for(const k of ['voice','sms','data','vas']){f.elements[k].disabled=shares;f.elements[k+'Share'].disabled=!shares;}}
async function mcSave_(){const c=consumptionState_(),f=document.getElementById('mc-form');if(c.saving||!validateForm_(f))return;const input=formObject_(f);Object.assign(input,{year:Number(c.year),month:c.editMonth,revision:c.editRevision});c.saving=true;setModalBusy_(true,'Đang lưu...');try{const r=await serverCall_('apiSaveConsumptionBatch',[input]);mcApply_(r.records);closeModal_();renderCurrentPage_();showToast_('Đã lưu số liệu.','success');}catch(e){setModalBusy_(false);mcMode_();showToast_(e.message,'error');}finally{c.saving=false;}}
function mcApply_(records){const c=consumptionState_();records.forEach(r=>{const key=r.MarketID==='VTG'?'vtgRecords':'records';c.data[key]=(c.data[key]||[]).filter(x=>x.RecordID!==r.RecordID).concat(r);});}
function mcOpenImport_(){const c=consumptionState_();c.preview=null;showModal_('Nhập nhiều kỳ','<p>Dán bảng từ Excel với dòng tiêu đề bên dưới. Số dùng dấu chấm thập phân, không dấu phân cách hàng nghìn. Đơn vị nghìn USD. Hoặc chọn file JSON lịch sử đã chuẩn hóa.</p><p class="work-context">marketCode | year | month | scenario | total | voice | sms | data | vas</p><input id="mc-import-file" type="file" accept=".json"><textarea id="mc-import-text" rows="12" aria-label="Dữ liệu nhập" placeholder="Dán các cột từ Excel tại đây"></textarea><div id="mc-preview"></div>',[{label:'Hủy',className:'ghost-btn',close:true},{label:'Xem trước',className:'secondary-btn',action:'mc-preview'},{label:'Lưu dữ liệu đã xem',className:'primary-btn',action:'mc-import-save'}]);}
function mcParseImport_(text){if(text.trim().startsWith('['))return JSON.parse(text);const rows=text.trim().split(/\r?\n/).map(r=>r.split('\t'));const h=rows.shift().map(s=>s.trim());return rows.filter(r=>r.some(v=>v.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()])));}
async function mcPreview_(){const c=consumptionState_();try{const f=document.getElementById('mc-import-file');const text=f.files.length?await f.files[0].text():document.getElementById('mc-import-text').value;const inputs=mcParseImport_(text);if(!Array.isArray(inputs)||!inputs.length||inputs.length>5000)throw Error('Nhập từ 1 đến 5.000 dòng.');c.preview=null;document.getElementById('mc-preview').textContent='Đang kiểm tra...';let preview=[];for(let i=0;i<inputs.length;i+=200)preview=preview.concat(await serverCall_('apiPreviewConsumption',inputs.slice(i,i+200)));const keys=new Set();preview.forEach((p,i)=>{p.line=i+1;if(p.record){const r=p.record,k=[r.MarketID,r.Year,r.Month,r.Scenario].join('|');if(keys.has(k))p.error='Trùng kỳ trong file';keys.add(k);}});c.preview=preview;document.getElementById('mc-preview').innerHTML='<p>'+preview.filter(p=>!p.error).length+' hợp lệ; '+preview.filter(p=>p.error).length+' lỗi. Dòng UNCHANGED được bỏ qua. Dòng REPLACE sẽ thay thế số đã có; kỳ đã chốt cần changeReason.</p><div class="table-wrap mc-import-preview"><table class="data-table"><tr><th>Dòng</th><th>Mã</th><th>Kỳ</th><th>Tổng</th><th>Hiện có</th><th>Kết quả</th></tr>'+preview.map(p=>'<tr><td>'+p.line+'</td><td>'+escapeHtml_(p.input.marketCode||p.input.marketId||'')+'</td><td>'+escapeHtml_(p.input.month+'/'+p.input.year)+'</td><td>'+mcNum_(p.record&&p.record.Total)+'</td><td>'+mcNum_(p.previous&&p.previous.Total)+'</td><td>'+escapeHtml_(p.error||p.action)+(p.record&&p.record.Reconciliation==='MISMATCH'?' · ⚠ Cơ cấu chưa khớp':'')+'</td></tr>').join('')+'</table></div>';}catch(e){showToast_(e.message,'error');}}
async function mcImportSave_(){const c=consumptionState_();if(c.saving)return;if(!c.preview||c.preview.some(p=>p.error)){showToast_('Xem trước và sửa các dòng lỗi trước khi lưu.','error');return;}c.preview=c.preview.filter(p=>p.action!=='UNCHANGED');c.saving=true;setModalBusy_(true,'Đang nhập...');try{while(c.preview.length){const batch=c.preview.slice(0,100);const r=await serverCall_('apiSaveConsumptionBatch',batch.map(p=>p.input));mcApply_(r.records);c.preview.splice(0,batch.length);setModalBusy_(true,'Còn '+c.preview.length+' dòng...');}closeModal_();renderCurrentPage_();showToast_('Đã nhập tất cả các kỳ.','success');}catch(e){setModalBusy_(false);document.getElementById('mc-preview').textContent='Còn '+c.preview.length+' dòng chưa lưu. Các lô trước đã lưu. Có thể thử lại hoặc xem trước lại file; '+e.message;showToast_(e.message,'error');}finally{c.saving=false;}}
async function mcHistory_(id){try{const rows=await serverCall_('apiConsumptionHistory',id);showModal_('Lịch sử số liệu',rows.map(r=>'<p><strong>'+escapeHtml_(r.CreatedAt)+' · '+escapeHtml_(r.UserID)+'</strong></p><pre class="mc-history">'+escapeHtml_(r.OldValue)+'\n→\n'+escapeHtml_(r.NewValue)+'</pre>').join('')||'<p>Chưa có lịch sử.</p>',[{label:'Đóng',className:'ghost-btn',close:true}]);}catch(e){showToast_(e.message,'error');}}
function mcExport_(){const c=consumptionState_(),rows=mcReportRows_(c);const csv=[['Market','Year','ThroughMonth','View','Unit','Actual','Plan','AchievementPercent','MoMPercent','YoYPercent','Data','DataSharePercent','MonthsAvailable'],...rows.map(r=>[r.market.ShortName,c.year,c.month,c.view,'USD_THOUSAND',r.actual.Total,r.plan.Total,r.achievement,r.mom,r.yoy,r.actual.Data,r.actual.DataShare,r.actual.count])].map(row=>row.map(v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='MobileConsumption_'+c.year+'_'+c.month+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function mcAction_(action,b){const c=consumptionState_();if(action==='mc-refresh')loadConsumption_();if(action==='mc-init')serverCall_('apiInitializeConsumption').then(loadConsumption_).catch(e=>showToast_(e.message,'error'));if(action==='mc-new'){if(!c.marketId)c.marketId=c.data.markets.filter(m=>!String(m.ShortName).startsWith('TEST'))[0]?.MarketID||'';mcOpen_();}if(action==='mc-detail'){c.marketId=b.dataset.marketId;renderCurrentPage_();}if(action==='mc-edit')mcOpen_(b.dataset.month);if(action==='mc-history')mcHistory_(b.dataset.recordId);if(action==='mc-import')mcOpenImport_();if(action==='mc-export')mcExport_();if(action==='mc-vtg-export')mcVTGExport_();}
function mcToolbar_(c){return '<div class="mc-toolbar"><label>Thị trường<select id="mc-market">'+mcOptions_([['','Tất cả thị trường'],['__VTG__','VTG · Tổng hợp công ty mẹ'],...c.data.markets.filter(m=>!String(m.ShortName).startsWith('TEST')).map(m=>[m.MarketID,m.ShortName+' · '+m.Country])],c.marketId)+'</select></label><label>Năm<input id="mc-year" required type="number" min="2000" max="2100" value="'+c.year+'"></label><label>Tháng / đến tháng<select id="mc-month">'+mcOptions_(Array.from({length:12},(_,i)=>[i+1,'T'+(i+1)]),c.month)+'</select></label><label>Báo cáo<select id="mc-view">'+mcOptions_([['MONTH','Tháng'],['YEAR','Năm / lũy kế']],c.view)+'</select></label><label>Số liệu<select id="mc-status">'+mcOptions_([['ALL','Tất cả (gồm nháp)'],['FINAL','Chỉ đã chốt']],c.status)+'</select></label></div>';}
</script>
