<style>
:root {
  --navy-950: #06172b;
  --navy-900: #071d36;
  --navy-850: #0a2544;
  --navy-800: #0d2f57;
  --blue-600: #2f6fed;
  --blue-500: #3e7bf2;
  --blue-100: #eaf1ff;
  --cyan-300: #83e7d6;
  --green-400: #77e1b1;
  --amber-400: #f7c66f;
  --red-400: #ff8f96;
  --ink-950: #061a35;
  --ink-800: #1f3b5c;
  --ink-600: #506985;
  --ink-500: #6f8399;
  --surface: #ffffff;
  --surface-soft: #f4f7fb;
  --surface-tint: #eef3f9;
  --border: #dbe4ef;
  --shadow: 0 16px 40px rgba(7, 29, 54, 0.08);
  --radius-xl: 28px;
  --radius-lg: 20px;
  --radius-md: 14px;
  --sidebar-w: 266px;
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
  background: var(--surface-soft);
  color: var(--ink-950);
  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea,
select {
  font: inherit;
}

button,
select {
  outline: none;
}

button:focus-visible,
select:focus-visible {
  box-shadow: 0 0 0 3px rgba(62, 123, 242, 0.22);
}

.app-shell {
  display: flex;
  min-height: 100vh;
}

.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  display: flex;
  flex-direction: column;
  padding: 30px 18px 22px;
  background: linear-gradient(180deg, #0a2340 0%, #06172b 100%);
  color: #fff;
  z-index: 30;
}

.brand-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 10px 28px;
}

.brand-mark {
  width: 56px;
  height: 56px;
  display: grid;
  place-items: center;
  flex: 0 0 auto;
  border-radius: 16px;
  background: linear-gradient(145deg, #3679f2, #2b65dd);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18), 0 10px 24px rgba(47, 111, 237, 0.28);
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.brand-copy {
  min-width: 0;
}

.brand-name {
  font-size: 20px;
  line-height: 1.05;
  font-weight: 800;
}

.brand-tagline {
  margin-top: 5px;
  color: #a9bdd4;
  font-size: 12px;
  white-space: nowrap;
}

.sidebar-nav {
  display: grid;
  gap: 9px;
}

.nav-item {
  width: 100%;
  min-height: 56px;
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 0 16px;
  border: 0;
  border-radius: 14px;
  background: transparent;
  color: #d9e6f3;
  text-align: left;
  cursor: pointer;
  transition: 160ms ease;
}

.nav-item:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #fff;
  transform: translateX(2px);
}

.nav-item.active {
  background: linear-gradient(135deg, #3478f2 0%, #2c69e6 100%);
  color: #fff;
  box-shadow: 0 10px 22px rgba(47, 111, 237, 0.24);
}

.nav-icon {
  width: 26px;
  display: inline-grid;
  place-items: center;
  flex: 0 0 auto;
  font-size: 18px;
  color: #cfe0f4;
}

.nav-item.active .nav-icon {
  color: #fff;
}

.nav-label {
  font-size: 16px;
  font-weight: 700;
}

.sidebar-spacer {
  flex: 1;
}

.sidebar-footer {
  margin-top: 20px;
}

.footer-link {
  min-height: 48px;
}

.sidebar-divider {
  height: 1px;
  margin: 10px 4px 18px;
  background: rgba(255, 255, 255, 0.13);
}

.version-block {
  display: grid;
  gap: 4px;
  padding: 0 12px;
}

.version-block strong {
  font-size: 14px;
}

.version-block span {
  color: #9eb2ca;
  font-size: 12px;
}

.main {
  width: calc(100% - var(--sidebar-w));
  min-width: 0;
  margin-left: var(--sidebar-w);
}

.topbar {
  height: 116px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 24px 34px;
  background: rgba(255, 255, 255, 0.96);
  border-bottom: 1px solid var(--border);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}

.eyebrow {
  margin-bottom: 3px;
  color: var(--ink-600);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.4px;
}

.topbar h1 {
  margin: 0;
  color: var(--ink-950);
  font-size: clamp(28px, 3vw, 40px);
  line-height: 1;
  letter-spacing: -1.4px;
}

.topbar-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.context-box {
  display: flex;
  align-items: center;
  gap: 9px;
}

.context-label {
  color: var(--ink-600);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.8px;
}

.context-box select {
  min-width: 154px;
  height: 46px;
  padding: 0 38px 0 14px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  color: var(--ink-950);
  cursor: pointer;
}

.primary-btn {
  height: 46px;
  padding: 0 18px;
  border: 0;
  border-radius: 12px;
  background: linear-gradient(135deg, #3478f2, #2d69e6);
  color: #fff;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(47, 111, 237, 0.23);
  transition: 160ms ease;
}

.primary-btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 26px rgba(47, 111, 237, 0.28);
}

.add-wrap {
  position: relative;
}

.add-menu {
  position: absolute;
  top: 54px;
  right: 0;
  width: 170px;
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: #fff;
  box-shadow: var(--shadow);
  z-index: 60;
}

.add-menu button {
  width: 100%;
  padding: 10px 12px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink-950);
  text-align: left;
  cursor: pointer;
}

.add-menu button:hover {
  background: var(--surface-tint);
}

.hidden {
  display: none !important;
}

.mobile-menu-btn {
  display: none;
  width: 42px;
  height: 42px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #fff;
  color: var(--ink-950);
  cursor: pointer;
}

.page-content {
  padding: 30px 32px 50px;
}

.hero-panel {
  position: relative;
  overflow: hidden;
  display: grid;
  grid-template-columns: minmax(0, 1.7fr) repeat(2, minmax(190px, 0.7fr));
  gap: 22px;
  padding: 30px;
  border-radius: var(--radius-xl);
  background: linear-gradient(120deg, #082541 0%, #123d72 100%);
  color: #fff;
  box-shadow: var(--shadow);
}

.hero-panel::after {
  content: "";
  position: absolute;
  right: -90px;
  top: -120px;
  width: 360px;
  height: 360px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(75, 141, 255, 0.2), rgba(75, 141, 255, 0));
  pointer-events: none;
}

.hero-lead,
.hero-stat {
  position: relative;
  z-index: 1;
}

.hero-kicker {
  color: #c7d6e8;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.4px;
}

.hero-value {
  margin-top: 12px;
  font-size: clamp(42px, 5vw, 66px);
  line-height: 0.95;
  font-weight: 800;
  letter-spacing: -2.4px;
}

.hero-subtitle {
  margin-top: 9px;
  color: #b9cade;
  font-size: 14px;
}

.hero-stat {
  align-self: stretch;
  padding: 22px;
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.09);
  backdrop-filter: blur(5px);
}

.hero-stat-label {
  color: #cad8e8;
  font-size: 14px;
}

.hero-stat-value {
  margin-top: 15px;
  font-size: 34px;
  font-weight: 800;
  letter-spacing: -1px;
}

.hero-stat-note {
  margin-top: 7px;
  color: var(--cyan-300);
  font-size: 13px;
  font-weight: 700;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-top: 18px;
}

.metric-card,
.panel,
.work-card,
.project-card {
  border: 1px solid var(--border);
  background: var(--surface);
  box-shadow: 0 10px 30px rgba(7, 29, 54, 0.045);
}

.metric-card {
  min-height: 132px;
  padding: 21px 22px;
  border-radius: 18px;
}

.metric-label {
  color: var(--ink-600);
  font-size: 13px;
  font-weight: 700;
}

.metric-value {
  margin-top: 12px;
  color: var(--ink-950);
  font-size: 30px;
  font-weight: 800;
  letter-spacing: -1px;
}

.metric-note {
  margin-top: 7px;
  color: var(--ink-500);
  font-size: 12px;
}

.two-col {
  display: grid;
  grid-template-columns: minmax(0, 1.3fr) minmax(320px, 0.7fr);
  gap: 18px;
  margin-top: 18px;
}

.panel {
  border-radius: var(--radius-lg);
  overflow: hidden;
}

.panel-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  padding: 24px 24px 18px;
}

.panel-kicker {
  color: var(--ink-600);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1.2px;
}

.panel-title {
  margin: 5px 0 0;
  color: var(--ink-950);
  font-size: 24px;
  letter-spacing: -0.7px;
}

.panel-meta {
  color: var(--ink-500);
  font-size: 12px;
  white-space: nowrap;
}

.work-list,
.project-list {
  display: grid;
  gap: 12px;
  padding: 0 18px 18px;
}

.work-card,
.project-card {
  border-radius: 16px;
  padding: 17px 18px;
  box-shadow: none;
}

.work-top,
.project-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.work-title,
.project-title {
  color: var(--ink-950);
  font-size: 15px;
  font-weight: 800;
}

.work-context,
.project-context {
  margin-top: 4px;
  color: var(--ink-500);
  font-size: 12px;
}

.badge {
  display: inline-flex;
  align-items: center;
  min-height: 26px;
  padding: 0 9px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.45px;
  white-space: nowrap;
}

.badge-danger {
  background: #fff0f1;
  color: #b83545;
}

.badge-warning {
  background: #fff5df;
  color: #9a6816;
}

.badge-info {
  background: #edf4ff;
  color: #3163bb;
}

.badge-success {
  background: #e9faf3;
  color: #23785b;
}

.progress-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
}

.progress-track {
  height: 7px;
  overflow: hidden;
  border-radius: 999px;
  background: #e8eef6;
}

.progress-fill {
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #3478f2, #4c8df8);
}

.progress-value {
  min-width: 38px;
  color: var(--ink-600);
  font-size: 12px;
  font-weight: 800;
  text-align: right;
}

.next-action {
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px solid var(--border);
}

.next-action-label {
  color: var(--ink-500);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 0.9px;
}

.next-action-text {
  margin-top: 5px;
  color: var(--ink-800);
  font-size: 13px;
  font-weight: 700;
}

.section-stack {
  display: grid;
  gap: 18px;
  margin-top: 18px;
}

.section-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: #fff;
  overflow: hidden;
}

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 19px 22px;
  border-bottom: 1px solid var(--border);
}

.section-head-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.section-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--blue-500);
}

.section-title {
  font-size: 14px;
  font-weight: 800;
}

.section-count {
  display: inline-grid;
  place-items: center;
  min-width: 28px;
  height: 28px;
  padding: 0 8px;
  border-radius: 999px;
  background: var(--surface-tint);
  color: var(--ink-600);
  font-size: 11px;
  font-weight: 800;
}

.section-body {
  padding: 12px;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: #fff;
}

.data-table {
  width: 100%;
  min-width: 920px;
  border-collapse: collapse;
}

.data-table th,
.data-table td {
  padding: 15px 16px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  vertical-align: middle;
}

.data-table th {
  background: #f8fafc;
  color: var(--ink-600);
  font-size: 11px;
  letter-spacing: 0.7px;
  text-transform: uppercase;
}

.data-table td {
  color: var(--ink-800);
  font-size: 13px;
}

.data-table tbody tr:last-child td {
  border-bottom: 0;
}

.data-table tbody tr:hover {
  background: #fbfdff;
}

.table-title {
  color: var(--ink-950);
  font-weight: 800;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}

.filter-chip {
  min-height: 36px;
  padding: 0 13px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: #fff;
  color: var(--ink-600);
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.filter-chip.active {
  border-color: #c8d9fb;
  background: var(--blue-100);
  color: #2c5eaf;
}

.project-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.project-card {
  padding: 22px;
  border-radius: 20px;
}

.project-summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 16px;
}

.project-summary-item {
  padding: 12px;
  border-radius: 12px;
  background: #f7f9fc;
}

.project-summary-label {
  color: var(--ink-500);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
}

.project-summary-value {
  margin-top: 5px;
  color: var(--ink-950);
  font-size: 13px;
  font-weight: 800;
}

.empty-state {
  padding: 70px 28px;
  border: 1px dashed #cad6e5;
  border-radius: 18px;
  background: #fff;
  text-align: center;
}

.empty-state h2 {
  margin: 0 0 8px;
}

.empty-state p {
  margin: 0;
  color: var(--ink-500);
}

.sidebar-backdrop {
  display: none;
}

@media (max-width: 1180px) {
  .hero-panel {
    grid-template-columns: 1fr 1fr;
  }

  .hero-lead {
    grid-column: 1 / -1;
  }

  .metric-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .two-col {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 900px) {
  :root {
    --sidebar-w: 238px;
  }

  .desktop-only {
    display: none;
  }

  .project-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 760px) {
  .sidebar {
    transform: translateX(-101%);
    transition: transform 180ms ease;
  }

  .sidebar.open {
    transform: translateX(0);
  }

  .sidebar-backdrop {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(2, 14, 27, 0.48);
  }

  .sidebar-backdrop.show {
    display: block;
  }

  .main {
    width: 100%;
    margin-left: 0;
  }

  .mobile-menu-btn {
    display: inline-grid;
    place-items: center;
  }

  .topbar {
    height: 92px;
    padding: 16px;
  }

  .eyebrow {
    display: none;
  }

  .topbar h1 {
    font-size: 28px;
  }

  .page-content {
    padding: 18px 14px 34px;
  }

  .hero-panel {
    grid-template-columns: 1fr;
    padding: 22px;
    border-radius: 22px;
  }

  .hero-lead {
    grid-column: auto;
  }

  .hero-stat {
    padding: 18px;
  }

  .metric-grid {
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .metric-card {
    min-height: 116px;
    padding: 17px;
  }

  .metric-value {
    font-size: 25px;
  }

  .project-summary-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 500px) {
  .metric-grid {
    grid-template-columns: 1fr;
  }

  .topbar-actions {
    gap: 8px;
  }

  .primary-btn {
    padding: 0 14px;
  }
}


/* =========================================================
   PR03 - MY WORK
   ========================================================= */
.mywork-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  padding: 12px 14px;
  background: #ffffff;
  border: 1px solid var(--border, #e5e7eb);
  border-radius: 16px;
}

.mywork-refresh { margin-left: auto; }

.mywork-sections {
  display: grid;
  gap: 18px;
}

.mywork-section { padding: 0; overflow: hidden; }
.mywork-section-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  padding: 20px 22px 14px;
  border-bottom: 1px solid var(--border, #e5e7eb);
}
.mywork-section-head h3 { margin: 4px 0 0; font-size: 16px; }
.mywork-count {
  min-width: 34px;
  height: 34px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #eef2ff;
  color: #1e3a8a;
  font-weight: 800;
}

.mywork-card-list { display: grid; }
.mywork-card {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 20px;
  padding: 20px 22px;
  border-bottom: 1px solid var(--border, #e5e7eb);
}
.mywork-card:last-child { border-bottom: 0; }
.mywork-card:hover { background: #f8fafc; }
.mywork-card-topline { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.mywork-alert-badge {
  display: inline-flex;
  align-items: center;
  min-height: 24px;
  padding: 3px 8px;
  border-radius: 999px;
  background: #fff1f2;
  color: #be123c;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: .02em;
}
.mywork-title-link {
  border: 0;
  padding: 0;
  background: transparent;
  color: #0f172a;
  font: inherit;
  font-size: 17px;
  font-weight: 800;
  text-align: left;
  cursor: pointer;
}
.mywork-title-link:hover { color: #2563eb; }
.mywork-project { margin-top: 4px; color: #64748b; font-size: 13px; }
.mywork-progress-row {
  display: grid;
  grid-template-columns: minmax(120px, 240px) auto;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  color: #64748b;
  font-size: 12px;
  font-weight: 700;
}
.mywork-result-preview { margin-top: 12px; color: #475569; font-size: 13px; line-height: 1.5; }
.mywork-next {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  display: grid;
  gap: 3px;
}
.mywork-next span { color: #64748b; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.mywork-next strong { color: #0f172a; font-size: 14px; }
.mywork-next small { color: #64748b; }
.mywork-card-actions { display: flex; align-items: flex-start; gap: 8px; }
.muted { color: #94a3b8; font-weight: 500; }

@media (max-width: 800px) {
  .mywork-card { grid-template-columns: 1fr; }
  .mywork-card-actions { justify-content: flex-start; }
  .mywork-refresh { margin-left: 0; }
}



/* =========================================================
   PR03 UI V2 - PRODUCTIVITY WORKSPACE
   Asana structure + Todoist focus + Linear density
   ========================================================= */
:root {

body { background: var(--mw-bg); color: var(--mw-text); font-size: 14px; }

.nav-item.active { background: var(--mw-blue); box-shadow: none; }

.version-block strong { font-size: 12px; }
.version-block span { font-size: 11px; }
.main { width: calc(100% - var(--sidebar-w)); margin-left: var(--sidebar-w); }
.topbar { height: 86px; padding: 0 30px; gap: 16px; background: #fff; border-bottom: 1px solid var(--mw-border); }

.page-content { padding: 24px 30px 50px; }

.primary-btn { height: 40px; padding: 0 15px; border-radius: 8px; box-shadow: none; background: var(--mw-blue); }
.primary-btn:hover { transform: none; box-shadow: none; background: #245ec9; }
.secondary-btn, .ghost-btn { min-height: 36px; border-radius: 8px; }

/* Hide old finance-style surfaces on operational screens */
.hero-panel, .metric-grid { margin-top: 0; }

.compact-summary-v2 { display: flex; align-items: center; flex-wrap: wrap; gap: 18px 24px; margin: 0 0 18px; color: var(--mw-text-2); }
.compact-stat-v2 { display: inline-flex; align-items: baseline; gap: 6px; }
.compact-stat-v2 strong { color: var(--mw-text); font-size: 18px; }
.compact-stat-v2.danger strong { color: var(--mw-danger); }
.productivity-toolbar-v2 { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
.filter-tabs-v2 { display: flex; gap: 3px; padding: 3px; border: 1px solid var(--mw-border); border-radius: 9px; background: #fff; }
.filter-chip-v2 { border: 0; border-radius: 6px; padding: 7px 11px; background: transparent; color: var(--mw-text-2); font-size: 13px; font-weight: 650; cursor: pointer; }
.filter-chip-v2:hover { background: #f3f5f8; }

.productivity-toolbar-right-v2 { display: flex; gap: 8px; align-items: center; }
.search-input-v2 { width: 250px; height: 38px; padding: 0 11px; border: 1px solid var(--mw-border); border-radius: 8px; background: #fff; color: var(--mw-text); }

/* My Work compact rows */
.work-section-v2 { margin-bottom: 24px; }
.work-section-head-v2 { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }

/* Dense Tasks list */
.task-list-v2 { background: #fff; border: 1px solid var(--mw-border); border-radius: 10px; overflow: hidden; }
.task-list-head-v2, .task-row-v2 { display: grid; grid-template-columns: minmax(320px,1fr) 120px 100px 120px 85px; align-items: center; gap: 10px; }

.task-row-v2 { min-height: 64px; padding: 8px 14px; border-bottom: 1px solid #edf0f4; cursor: pointer; }

.task-title-line-v2 { display: flex; align-items: center; gap: 8px; font-weight: 680; }
.task-title-v2 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-sub-v2 { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 8px 12px; color: var(--mw-muted); font-size: 12px; }
.priority-dot-v2 { width: 7px; height: 7px; flex: 0 0 auto; border-radius: 50%; background: #78909c; }
.priority-dot-v2.high { background: var(--mw-danger); }

.due-overdue-v2 { color: var(--mw-danger); font-weight: 700; }

.progress-mini-track-v2 { width: 58px; height: 5px; overflow: hidden; border-radius: 999px; background: #e8edf3; }

/* Projects compact */
.project-list-v2 { display: grid; gap: 10px; }
.project-row-v2 { padding: 16px 18px; border: 1px solid var(--mw-border); border-radius: 10px; background: #fff; cursor: pointer; }
.project-row-v2:hover { border-color: #c9d6ea; }
.project-row-top-v2 { display: flex; justify-content: space-between; gap: 20px; }
.project-name-v2 { font-size: 15px; font-weight: 720; }
.project-meta-v2 { margin-top: 5px; color: var(--mw-muted); font-size: 12px; }

.task-drawer { position: fixed; top: 0; right: 0; z-index: 90; width: min(520px,94vw); height: 100vh; overflow-y: auto; background: #fff; box-shadow: -12px 0 35px rgba(15,23,42,.14); transform: translateX(105%); transition: transform .22s ease; }

  .work-right-v2 { flex-direction: column; align-items: flex-end; gap: 3px; }
  .dashboard-summary-v2 { grid-template-columns: 1fr 1fr; }
}
