<script>
function monthlyNorm_(v){return String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase().trim();}
function monthlyExtract_(wb,filename,compareOld){
 const td=wb.Sheets['TD thuc'],th=wb.Sheets['TH thi truong'];if(!td||!th)throw Error('File phải có hai sheet TD thuc và TH thi truong.');
 const cell=(s,r,c)=>s[XLSX.utils.encode_cell({r:r-1,c:c-1})],val=(s,r,c)=>cell(s,r,c)?.v;
 const num=(s,r,c)=>{const x=cell(s,r,c);if(!x||x.v==null||x.v==='')return null;if(x.t==='e'||typeof x.v!=='number'||!Number.isFinite(x.v)||x.v<0)throw Error('Giá trị không hợp lệ tại '+(s===td?'TD thuc':'TH thi truong')+'!'+XLSX.utils.encode_cell({r:r-1,c:c-1}));return x.v;};
 const year=Number(val(th,1,2)),month=Number(val(th,1,1));if(!Number.isInteger(year)||year<2000||year>2100||!Number.isInteger(month)||month<1||month>12)throw Error('Không xác định được kỳ tại TH thi truong!A1:B1.');
 const filePeriod=filename.match(/^(20\d{2})[._-](\d{2})[. _-]/);if(filePeriod&&(Number(filePeriod[1])!==year||Number(filePeriod[2])!==month))throw Error('Kỳ trong tên file khác A1:B1. Kiểm tra lại file.');
 const canonical=v=>String(v||'').trim().toUpperCase().replace(/^VBD$/,'VTB'),codes=['VTG','VTC','STL','NAT','MOV','VTL','VTP','VTB','VTZ','MYN'];
 const blocks={};for(let r=10;r<300;r++){const code=canonical(val(td,r,2));if(!codes.includes(code))continue;if(blocks[code])throw Error('Trùng khối thị trường '+code);if(!monthlyNorm_(val(td,r+1,3)).startsWith('tong tieu dung')||monthlyNorm_(val(td,r+2,3))!=='thoai'||monthlyNorm_(val(td,r+3,3))!=='sms'||monthlyNorm_(val(td,r+4,3))!=='data'||monthlyNorm_(val(td,r+5,3))!=='vas')throw Error('Cấu trúc TD thuc thay đổi tại '+code);blocks[code]=r+1;}
 if(codes.some(c=>!blocks[c]))throw Error('Thiếu khối VTG hoặc thị trường trong TD thuc.');
 let start=0;for(let c=1;c<600;c++){if(monthlyNorm_(val(td,8,c))==='th '+year&&monthlyNorm_(val(td,9,c))==='t1'){if(start)throw Error('Trùng khối thực hiện '+year);start=c;}}
 if(!start)throw Error('Không tìm thấy khối TH '+year+' và T1 trong TD thuc.');for(let m=1;m<=12;m++)if(monthlyNorm_(val(td,9,start+m-1))!=='t'+m)throw Error('Cột tháng TD thuc không đúng cấu trúc.');
 const consumption=[];for(let m=compareOld?1:month;m<=month;m++)for(const code of codes){const r=blocks[code],c=start+m-1,values=['total','voice','sms','data','vas'].map((k,i)=>[k,num(td,r+i,c)]);if(values.some(x=>x[1]===null))throw Error('Thiếu giá trị TD thuc: '+code+' T'+m+'/'+year);consumption.push({marketCode:code,year,month:m,scenario:'ACTUAL',inputMode:'AMOUNTS',status:'DRAFT',...Object.fromEntries(values),source:filename+' | TD thuc!'+XLSX.utils.encode_cell({r:r-1,c:c-1})+':'+XLSX.utils.encode_cell({r:r+3,c:c-1}),note:'Monthly source upload; reported period '+month+'/'+year+'. Cached Excel values; no recalculation.'});}
 const fields=[[7,'sites','so luong vi tri'],[8,'registered','thue bao reg'],[9,'active','thue bao thuc tai'],[10,'population','dan so'],[18,'marketShare','thi phan viettel'],[19,'arpuActual','arpu (ty gia thuc te)'],[20,'arpuFixed','arpu (ty gia co dinh)'],[21,'arpu4g','arpu 4g'],[22,'exchangeRate','ty gia'],[24,'dataSubsShare','ty trong tb data'],[25,'data4gShare','ty trong thue bao data 4g'],[28,'dou','dou'],[29,'dou4g','dou 4g'],[30,'dataPrice','gia ban data'],[31,'dataCost','gia thanh data'],[35,'mouOutgoing','mou di'],[36,'voicePrice','gia ban thoai noi mang'],[37,'voiceCost','gia thanh thoai noi mang']];
 for(const [r,k,label] of fields)if(!monthlyNorm_(val(th,r,1)).startsWith(label))throw Error('Dòng chỉ tiêu TH thi truong thay đổi: '+k);
 if(monthlyNorm_(val(th,49,1))!=='t'+month+'/'+year)throw Error('Kỳ cơ cấu TH thi truong không khớp A1:B1.');
 for(let i=0;i<4;i++)if(monthlyNorm_(val(th,51+i,1))!==['voice','sms','data','vas'][i])throw Error('Cơ cấu dịch vụ TH thi truong thay đổi.');
 const kpi=[];for(let c=3;c<=13;c++){const code=canonical(val(th,1,c));if(!code)continue;if(!codes.includes(code)&&code!=='VTT')throw Error('Mã thị trường không hỗ trợ: '+code);if(kpi.some(r=>r.marketCode===code))throw Error('Trùng cột '+code);const values={},references={};for(const [r,k] of fields){let n=num(th,r,c);if(n!==null&&['marketShare','dataSubsShare','data4gShare'].includes(k))n*=100;values[k]=n;if(['sites','population','marketShare','dataCost','voiceCost'].includes(k))references[k]=String(val(th,r,1));}if(code==='VTT'){const n=num(th,26,c);values.originalDataShare=n===null?null:n*100;}kpi.push({marketCode:code,year,month,values,references,source:filename+' | TH thi truong | column '+XLSX.utils.encode_col(c-1),note:'Monthly source upload; cached values. Reference periods retained from row labels.'});}
 for(let c=3;c<=12;c++){const code=canonical(val(th,50,c));if(!codes.includes(code))throw Error('Mã cơ cấu không hợp lệ: '+code);let r=kpi.find(r=>r.marketCode===code);if(!r){r={marketCode:code,year,month,values:{},references:{},source:filename+' | TH thi truong',note:'Original composition snapshot'};kpi.push(r);}for(let i=0;i<4;i++){const n=num(th,51+i,c);r.values['original'+['Voice','SMS','Data','VAS'][i]+'Share']=n===null?null:n*100;}}
 return {year,month,filename,compareOld:!!compareOld,consumption,kpi};
}
</script>
