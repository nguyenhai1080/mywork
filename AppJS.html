<script>
const PAGE_TITLES = {
  'my-work': 'My Work',
  'tasks': 'Tasks',
  'projects': 'Projects',
  'markets': 'Market Contacts',
  'consumption': 'Tiêu dùng di động',
  'dashboard': 'Dashboard'
};

const STATE = {
  page: 'my-work',
  marketData: null, marketId: '', marketSearch: '',
  tasks: [],
  projects: [],
  projectDetail: null,
  users: [],
  currentUser: null,
  today: '',
  taskFilter: 'ACTIVE',
  taskSearch: '',
  currentTaskDetail: null,
  loadingTasks: false,
  myWork: null,
  myWorkView: 'THIS_WEEK'
};

const DEMO_PROJECTS = [
  {
    name: 'Halotel OTT TV',
    code: 'PRJ0001',
    progress: 48,
    status: 'IN PROGRESS',
    health: 'ON TRACK',
    target: '31 Dec 2026',
    completed: '6 / 14',
    milestone: 'Vendor selected - 15 Oct',
    next: 'Finalize Business Model'
  },
  {
    name: 'Dominica Super App',
    code: 'PRJ0002',
    progress: 35,
    status: 'PLANNING',
    health: 'ATTENTION',
    target: '31 Mar 2027',
    completed: '4 / 12',
    milestone: 'Business model - 30 Sep',
    next: 'Complete benchmark framework'
  }
];

init_();

async function init_() {
  bindNavigation_();
  bindHeader_();
  bindPageDelegation_();
  bindOverlayDelegation_();
  navigateTo('my-work');

  try {
    await Promise.all([loadTaskBootstrap_(), loadMyWorkData_(), loadProjects_()]);
    renderCurrentPage_();
  } catch (error) {
    showToast_(error.message || String(error), 'error');
  }
}

function bindNavigation_() {
  document.querySelectorAll('.nav-item[data-page]').forEach(button => {
    button.addEventListener('click', () => {
      navigateTo(button.dataset.page);
      closeMobileSidebar_();
    });
  });
}

function bindHeader_() {
  const addBtn = document.getElementById('add-btn');
  const addMenu = document.getElementById('add-menu');
  const mobileBtn = document.getElementById('mobile-menu-btn');
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('sidebar-backdrop');

  addBtn.addEventListener('click', event => {
    event.stopPropagation();
    addMenu.classList.toggle('hidden');
  });

  addMenu.querySelectorAll('button').forEach(button => {
    button.addEventListener('click', () => {
      addMenu.classList.add('hidden');
      if (button.dataset.action === 'new-task') {
        openNewTaskModal_();
      } else {
        openProjectModal_();
      }
    });
  });

  document.addEventListener('click', () => addMenu.classList.add('hidden'));

  mobileBtn.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    backdrop.classList.toggle('show');
  });

  backdrop.addEventListener('click', closeMobileSidebar_);
}

function bindPageDelegation_() {
  const pageContent = document.getElementById('page-content');

  pageContent.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;

    const action = button.dataset.action;
    const taskId = button.dataset.taskId;
    marketAction_(action,button);
    mcAction_(action,button);

    if (action === 'new-project') openProjectModal_();
    if (action === 'open-project') openProject_(button.dataset.projectId);
    if (action === 'edit-project') openProjectModal_(STATE.projectDetail.project);
    if (action === 'back-projects') { STATE.projectDetail=null; renderCurrentPage_(); }
    if (action === 'project-task') openProjectTaskModal_(button.dataset.parentId||'');
    if (action === 'edit-wbs') openWbsModal_(taskId);
    if (action === 'new-task') openNewTaskModal_();
    if (action === 'open-task') openTaskDetail_(taskId);
    if (action === 'back-tasks') {
      STATE.currentTaskDetail = null;
      navigateTo('tasks');
    }
    if (action === 'edit-task') openEditTaskModal_();
    if (action === 'update-result') openUpdateResultModal_();
    if (action === 'complete-task') openCompleteTaskModal_();
    if (action === 'reopen-task') openReopenTaskModal_();
    if (action === 'cancel-task') openCancelTaskModal_();
    if (action === 'set-task-filter') {
      STATE.taskFilter = button.dataset.filter || 'ACTIVE';
      renderCurrentPage_();
    }
    if (action === 'set-mywork-view') {
      STATE.myWorkView = button.dataset.view || 'THIS_WEEK';
      renderCurrentPage_();
    }
    if (action === 'refresh-my-work') {
      loadMyWorkData_().then(renderCurrentPage_).catch(error => showToast_(error.message || String(error), 'error'));
    }
    if (action === 'quick-update-task') {
      openTaskDetail_(taskId).then(() => openUpdateResultModal_()).catch(error => showToast_(error.message || String(error), 'error'));
    }
  });

  pageContent.addEventListener('change', event=>{const map={'mc-market':'marketId','mc-year':'year','mc-month':'month','mc-view':'view','mc-status':'status'};if(map[event.target.id]){if(event.target.id==='mc-year'&&!event.target.checkValidity())return;consumptionState_()[map[event.target.id]]=event.target.value;renderCurrentPage_();}});
  pageContent.addEventListener('input', event => {
    if(event.target.id==='market-search'){STATE.marketSearch=event.target.value;document.getElementById('market-table-host').innerHTML=renderMarketTable_();}
    if (event.target.id === 'task-search') {
      STATE.taskSearch = event.target.value || '';
      renderTaskTableOnly_();
    }
  });
}

function bindOverlayDelegation_() {
  const root = document.getElementById('overlay-root');

  root.addEventListener('click', event => {
    if (event.target.matches('.modal-backdrop') || event.target.closest('[data-close-modal]')) {
      closeModal_();
      return;
    }

    const actionButton = event.target.closest('[data-modal-action]');
    if (!actionButton) return;

    const action = actionButton.dataset.modalAction;
    if(action==='mc-save')mcSave_();
    if(action==='mc-preview')mcPreview_();
    if(action==='mc-import-save')mcImportSave_();
    if(action==='save-market')submitMarket_(false);
    if(action==='save-market-contact')submitMarket_(true);
    if (action === 'save-project') submitProject_();
    if (action === 'save-project-task') submitProjectTask_();
    if (action === 'save-wbs') submitWbs_();
    if (action === 'save-new-task') submitNewTask_();
    if (action === 'save-edit-task') submitEditTask_();
    if (action === 'save-task-result') submitTaskResult_();
    if (action === 'complete-task') submitCompleteTask_();
    if (action === 'reopen-task') submitReopenTask_();
    if (action === 'cancel-task') submitCancelTask_();
  });

  root.addEventListener('change', event => {
    if(event.target.id==='mc-mode')mcMode_();
    if(event.target.id==='mc-form-market'){consumptionState_().marketId=event.target.value==='VTG'?'__VTG__':event.target.value;mcForm_();}
    if(event.target.id==='mc-form-scenario'){consumptionState_().editScenario=event.target.value;mcForm_();}
    if (event.target.id === 'result-status') {
      updateResultDynamic_();
    }
  });

  root.addEventListener('input', event => {
    if (event.target.id === 'result-progress') {
      updateProgressReasonVisibility_();
    }
  });
}

function closeMobileSidebar_() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('show');
}

function navigateTo(page) {
  STATE.page = page;
  if(page==='consumption'&&!consumptionState_().data&&!consumptionState_().loading)loadConsumption_();
  if(page==='markets'&&!STATE.marketData&&!STATE.marketLoading)refreshMarkets_();
  STATE.currentTaskDetail = page === 'tasks' ? STATE.currentTaskDetail : null;

  document.querySelectorAll('.nav-item[data-page]').forEach(item => {
    item.classList.toggle('active', item.dataset.page === page);
  });

  document.getElementById('page-title').textContent = PAGE_TITLES[page] || 'MyWork';
  renderCurrentPage_();
}

function renderCurrentPage_() {
  const target = document.getElementById('page-content');

  if (STATE.page === 'tasks' && STATE.currentTaskDetail) {
    target.innerHTML = renderTaskDetail_(STATE.currentTaskDetail);
    return;
  }

  const renderers = {
    'my-work': renderMyWork_,
    'tasks': renderTasks_,
    'projects': renderProjects_,
    'markets': renderMarkets_,
    'consumption': renderConsumption_,
    'dashboard': renderDashboard_
  };

  target.innerHTML = (renderers[STATE.page] || renderMyWork_)();
}

async function loadTaskBootstrap_() {
  STATE.loadingTasks = true;
  const data = await serverCall_('apiTaskBootstrap');
  STATE.tasks = data.tasks || [];
  STATE.users = data.users || [];
  STATE.currentUser = data.currentUser || null;
  STATE.today = data.today || '';
  STATE.loadingTasks = false;
}

async function refreshTasks_() {
  STATE.loadingTasks = true;
  try {
    const results = await Promise.all([
      serverCall_('apiListTasks', {}),
      serverCall_('apiGetMyWork', {})
    ]);
    STATE.tasks = results[0] || [];
    STATE.myWork = results[1] || null;
    await loadProjects_();
    if (STATE.projectDetail) STATE.projectDetail=await serverCall_('apiGetProject',STATE.projectDetail.project.ProjectID);
  } finally {
    STATE.loadingTasks = false;
  }
}

function loadMyWorkData_() {
  return serverCall_('apiGetMyWork', {}).then(data => {
    STATE.myWork = data || null;
    return data;
  });
}

function renderMyWork_() {
  const data = STATE.myWork;
  if (!data) return renderLoading_('Loading My Work...');

  const summary = data.summary || {};
  const sections = data.sections || {};

  return `
    ${hero_('MY WORK', String(summary.totalActive || 0), 'active work items', [
      { label: 'Overdue', value: String(summary.overdue || 0), note: 'Need attention' },
      { label: 'Follow-up', value: String(summary.followUpDue || 0), note: 'Due / overdue' }
    ])}

    <div class="metric-grid">
      ${metric_('Due Today', String(summary.dueToday || 0), 'Task deadlines today')}
      ${metric_('Waiting', String(summary.waiting || 0), 'External dependency')}
      ${metric_('Missing Next Action', String(summary.missingNextAction || 0), 'Needs planning')}
      ${metric_('My Work Engine', 'LIVE', 'PR03 classification')}
    </div>

    <div class="mywork-toolbar section-stack">
      ${myWorkViewChip_('TODAY', 'Today')}
      ${myWorkViewChip_('THIS_WEEK', 'This Week')}
      ${myWorkViewChip_('OVERDUE', 'Overdue')}
      ${myWorkViewChip_('WAITING', 'Waiting')}
      ${myWorkViewChip_('ALL', 'All Active')}
      <button class="ghost-btn mywork-refresh" type="button" data-action="refresh-my-work">Refresh</button>
    </div>

    <div class="mywork-sections section-stack">
      ${renderMyWorkSections_(sections)}
    </div>
  `;
}

function myWorkViewChip_(value, label) {
  const active = STATE.myWorkView === value ? ' active' : '';
  return `<button class="filter-chip${active}" type="button" data-action="set-mywork-view" data-view="${value}">${label}</button>`;
}

function renderMyWorkSections_(sections) {
  const need = sections.needAttention || [];
  const today = sections.today || [];
  const upcoming = sections.upcoming || [];
  const waiting = sections.waiting || [];
  const view = STATE.myWorkView;

  if (view === 'OVERDUE') {
    return renderMyWorkSection_('OVERDUE', 'Tasks already past deadline', need.filter(task => task.IsOverdue), 'danger');
  }
  if (view === 'WAITING') {
    return renderMyWorkSection_('WAITING', 'Waiting for another person or dependency', waiting, 'waiting');
  }
  if (view === 'TODAY') {
    return renderMyWorkSection_('NEED ATTENTION', 'Urgent items requiring action', need, 'danger') +
      renderMyWorkSection_('TODAY', 'Actions and deadlines scheduled today', today, 'today');
  }
  if (view === 'ALL') {
    return renderMyWorkSection_('ALL ACTIVE WORK', 'Current actionable tasks', [].concat(need, today, upcoming, waiting), 'all');
  }

  return renderMyWorkSection_('NEED ATTENTION', 'Overdue, follow-up and high-priority items', need, 'danger') +
    renderMyWorkSection_('TODAY', 'Actions and deadlines scheduled today', today, 'today') +
    renderMyWorkSection_('UPCOMING', 'Next seven days', upcoming, 'upcoming') +
    renderMyWorkSection_('WAITING', 'Waiting for another person or dependency', waiting, 'waiting');
}

function renderMyWorkSection_(title, subtitle, tasks, tone) {
  tasks = tasks || [];
  return `
    <section class="panel mywork-section ${tone || ''}">
      <div class="mywork-section-head">
        <div>
          <div class="panel-kicker">${escapeHtml_(title)}</div>
          <h3>${escapeHtml_(subtitle)}</h3>
        </div>
        <span class="mywork-count">${tasks.length}</span>
      </div>
      <div class="mywork-card-list">
        ${tasks.length ? tasks.map(renderMyWorkCard_).join('') : `<div class="empty-inline">No items in this section.</div>`}
      </div>
    </section>
  `;
}

function renderMyWorkCard_(task) {
  const attention = (task.AttentionReasons || []).map(item => `<span class="mywork-alert-badge">${escapeHtml_(item.label)}</span>`).join('');
  const project = task.ProjectName ? `<div class="mywork-project">${escapeHtml_(task.ProjectName)}</div>` : '';
  const latest = task.LatestResult || {};
  const resultPreview = latest.CompletedWork ? escapeHtml_(latest.CompletedWork) : '';
  const nextAction = task.NextAction ? escapeHtml_(task.NextAction) : '<span class="muted">Next action not defined</span>';
  const dueLabel = task.NextActionDue ? `Next ${formatDate_(task.NextActionDue)}` : (task.DueDate ? `Due ${formatDate_(task.DueDate)}` : '');

  return `
    <article class="mywork-card">
      <div class="mywork-card-main">
        <div class="mywork-card-topline">
          <span class="badge ${priorityBadgeClass_(task.Priority)}">${escapeHtml_(task.Priority || 'MEDIUM')}</span>
          ${attention}
        </div>
        <button class="mywork-title-link" type="button" data-action="open-task" data-task-id="${escapeHtml_(task.TaskID)}">${escapeHtml_(task.TaskTitle)}</button>
        ${project}
        <div class="mywork-progress-row">
          <div class="progress-track"><div class="progress-fill" style="width:${Number(task.Progress) || 0}%"></div></div>
          <span>${Number(task.Progress) || 0}%</span>
        </div>
        ${resultPreview ? `<div class="mywork-result-preview"><strong>Latest:</strong> ${resultPreview}</div>` : ''}
        <div class="mywork-next"><span>Next Action</span><strong>${nextAction}</strong><small>${escapeHtml_(dueLabel)}</small></div>
      </div>
      <div class="mywork-card-actions">
        <button class="secondary-btn" type="button" data-action="quick-update-task" data-task-id="${escapeHtml_(task.TaskID)}">Update Result</button>
        <button class="ghost-btn" type="button" data-action="open-task" data-task-id="${escapeHtml_(task.TaskID)}">Open</button>
      </div>
    </article>
  `;
}

function renderTasks_() {
  if (STATE.loadingTasks) return renderLoading_('Loading tasks...');

  const active = STATE.tasks.filter(isTaskActive_);
  const completed = STATE.tasks.filter(task => task.Status === 'COMPLETED');
  const waiting = STATE.tasks.filter(task => task.Status === 'WAITING');
  const overdue = STATE.tasks.filter(task => task.IsOverdue);
  const high = active.filter(task => task.Priority === 'HIGH');
  const noNextAction = active.filter(task => !String(task.NextAction || '').trim());

  return `
    ${hero_('TASK MANAGEMENT', String(active.length), 'active tasks', [
      { label: 'In progress', value: String(active.filter(task => task.Status === 'IN_PROGRESS').length), note: 'Live from Google Sheets' },
      { label: 'Completed', value: String(completed.length), note: 'All completed tasks' }
    ])}

    <div class="metric-grid">
      ${metric_('High Priority', String(high.length), 'Active high-priority tasks')}
      ${metric_('Waiting', String(waiting.length), 'External dependency')}
      ${metric_('Overdue', String(overdue.length), 'Calculated automatically')}
      ${metric_('No Next Action', String(noNextAction.length), 'Needs planning')}
    </div>

    <div class="section-stack">
      <div class="task-toolbar-card">
        <div class="toolbar task-filter-bar">
          ${filterChip_('ACTIVE', 'All Active')}
          ${filterChip_('IN_PROGRESS', 'In Progress')}
          ${filterChip_('WAITING', 'Waiting')}
          ${filterChip_('OVERDUE', 'Overdue')}
          ${filterChip_('COMPLETED', 'Completed')}
          ${filterChip_('ALL', 'All')}
        </div>
        <div class="task-toolbar-actions">
          <input id="task-search" class="search-input" type="search" placeholder="Search tasks..." value="${escapeHtml_(STATE.taskSearch)}">
          <button class="primary-btn" type="button" data-action="new-task">+ New Task</button>
        </div>
      </div>

      <div id="task-table-host">
        ${renderTaskTable_()}
      </div>
    </div>
  `;
}

function renderTaskTableOnly_() {
  const host = document.getElementById('task-table-host');
  if (host) host.innerHTML = renderTaskTable_();
}

function renderTaskTable_() {
  const tasks = getFilteredTasks_();
  if (!tasks.length) {
    return `
      <div class="empty-state">
        <h2>No tasks found</h2>
        <p>Create a task or change the current filter.</p>
        <button class="primary-btn empty-state-btn" type="button" data-action="new-task">+ New Task</button>
      </div>
    `;
  }

  return `
    <div class="table-wrap">
      <table class="data-table task-table">
        <thead>
          <tr>
            <th>Task</th>
            <th>Priority</th>
            <th>Assigned by</th>
            <th>Due</th>
            <th>Progress</th>
            <th>Status</th>
            <th>Next Action</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${tasks.map(taskRowLive_).join('')}
        </tbody>
      </table>
    </div>
  `;
}

function renderTaskDetail_(detail) {
  const task = detail.task;
  const latest = detail.latestResult;
  const calc = detail.calculated || {};
  const statusClass = statusBadgeClass_(task.Status);
  const dueLabel = calc.IsOverdue
    ? `Overdue ${calc.OverdueDays} day${Number(calc.OverdueDays) === 1 ? '' : 's'}`
    : `Due ${formatDate_(task.DueDate)}`;
  const terminal = ['COMPLETED', 'CANCELLED'].includes(task.Status);

  return `
    <div class="detail-toolbar">
      <button class="ghost-btn" type="button" data-action="back-tasks">Back to Tasks</button>
      <div class="detail-actions">
        <button class="ghost-btn" type="button" data-action="edit-task">Edit Task</button>
        ${!terminal ? `<button class="secondary-btn" type="button" data-action="update-result">Update Result</button>` : ''}
        ${!terminal ? `<button class="primary-btn" type="button" data-action="complete-task">Complete</button>` : ''}
        ${task.Status === 'COMPLETED' ? `<button class="primary-btn" type="button" data-action="reopen-task">Reopen</button>` : ''}
        ${!terminal ? `<button class="danger-text-btn" type="button" data-action="cancel-task">Cancel</button>` : ''}
      </div>
    </div>

    <div class="task-detail-hero">
      <div>
        <div class="hero-kicker">${escapeHtml_(task.TaskID)}</div>
        <h2>${escapeHtml_(task.TaskTitle)}</h2>
        <div class="detail-badges">
          <span class="badge ${priorityBadgeClass_(task.Priority)}">${escapeHtml_(task.Priority)}</span>
          <span class="badge ${statusClass}">${escapeHtml_(statusLabel_(task.Status))}</span>
          <span class="badge ${calc.IsOverdue ? 'badge-danger' : 'badge-info'}">${escapeHtml_(dueLabel)}</span>
        </div>
      </div>
      <div class="detail-progress-box">
        <div class="detail-progress-value">${Number(task.Progress) || 0}%</div>
        <div class="progress-track"><div class="progress-fill" style="width:${Number(task.Progress) || 0}%"></div></div>
      </div>
    </div>

    <div class="detail-grid section-stack">
      <div class="panel detail-main-panel">
        ${panelHeader_('CURRENT', 'Latest Result', latest ? `Updated ${formatDate_(latest.UpdateDate)}` : 'No update yet')}
        <div class="detail-result-body">
          ${latest ? renderResultSections_(latest) : `<div class="empty-inline">No result update has been recorded yet.</div>`}
        </div>
      </div>

      <div class="panel detail-side-panel">
        ${panelHeader_('TASK', 'Information', task.SourceType === 'PROJECT' ? 'Project Task' : 'Standalone')}
        <div class="info-list">
          ${infoRow_('Owner', userName_(task.OwnerID))}
          ${infoRow_('Assigned By', task.AssignedBy || '-')}
          ${infoRow_('Assigned Date', formatDate_(task.AssignedDate))}
          ${infoRow_('Due Date', formatDate_(task.DueDate))}
          ${infoRow_('Expected Output', task.ExpectedOutput || '-')}
          ${task.NextAction ? infoRow_('Next Action', task.NextAction) : ''}
          ${task.NextActionDue ? infoRow_('Next Action Due', formatDate_(task.NextActionDue)) : ''}
          ${task.WaitingFor ? infoRow_('Waiting For', task.WaitingFor) : ''}
          ${task.FollowUpDate ? infoRow_('Follow-up', formatDate_(task.FollowUpDate)) : ''}
        </div>
      </div>
    </div>

    <div class="panel section-stack">
      ${panelHeader_('HISTORY', 'Result Timeline', `${(detail.history || []).length} update${(detail.history || []).length === 1 ? '' : 's'}`)}
      <div class="timeline-list">
        ${(detail.history || []).length
          ? detail.history.map(historyItem_).join('')
          : `<div class="empty-inline">Task created. No result history yet.</div>`}
      </div>
    </div>
  `;
}

function renderProjectsLegacy_() {
  return `
    ${hero_('PROJECT PORTFOLIO', '2', 'demo projects until PR04', [
      { label: 'On track', value: '1', note: 'Demo data' },
      { label: 'Attention', value: '1', note: 'Demo data' }
    ])}
    <div class="project-grid section-stack">
      ${projectCard_(DEMO_PROJECTS[0])}
      ${projectCard_(DEMO_PROJECTS[1])}
    </div>
  `;
}

function renderDashboard_() {
  const active = STATE.tasks.filter(isTaskActive_).length;
  const overdue = STATE.tasks.filter(task => task.IsOverdue).length;
  const waiting = STATE.tasks.filter(task => task.Status === 'WAITING').length;

  return `
    ${hero_('WORK OVERVIEW', String(active), 'active tasks', [
      { label: 'Overdue', value: String(overdue), note: 'Live task data' },
      { label: 'Waiting', value: String(waiting), note: 'Live task data' }
    ])}
    <div class="metric-grid">
      ${metric_('Active Tasks', String(active), 'Task Core live')}
      ${metric_('Completed', String(STATE.tasks.filter(task => task.Status === 'COMPLETED').length), 'All completed tasks')}
      ${metric_('Projects', 'PR04', 'Project Core next')}
      ${metric_('Dashboard', 'PR06', 'Hardening and summary later')}
    </div>
  `;
}

function filterChip_(filter, label) {
  return `<button class="filter-chip ${STATE.taskFilter === filter ? 'active' : ''}" type="button" data-action="set-task-filter" data-filter="${filter}">${escapeHtml_(label)}</button>`;
}

function getFilteredTasks_() {
  const query = String(STATE.taskSearch || '').trim().toLowerCase();

  return STATE.tasks.filter(task => {
    if (STATE.taskFilter === 'ACTIVE' && !isTaskActive_(task)) return false;
    if (STATE.taskFilter === 'IN_PROGRESS' && task.Status !== 'IN_PROGRESS') return false;
    if (STATE.taskFilter === 'WAITING' && task.Status !== 'WAITING') return false;
    if (STATE.taskFilter === 'OVERDUE' && !task.IsOverdue) return false;
    if (STATE.taskFilter === 'COMPLETED' && task.Status !== 'COMPLETED') return false;

    if (!query) return true;
    return [
      task.TaskTitle,
      task.Description,
      task.AssignedBy,
      task.ExpectedOutput,
      task.NextAction,
      task.WaitingFor,
      task.TaskID
    ].some(value => String(value || '').toLowerCase().includes(query));
  });
}

function taskRowLive_(task) {
  const dueText = task.IsOverdue
    ? `<span class="due-danger">Overdue ${Number(task.OverdueDays) || 0}d</span><div class="work-context">${formatDate_(task.DueDate)}</div>`
    : formatDate_(task.DueDate);

  return `
    <tr>
      <td>
        <button class="table-link" type="button" data-action="open-task" data-task-id="${escapeHtml_(task.TaskID)}">${escapeHtml_(task.TaskTitle)}</button>
        <div class="work-context">${escapeHtml_(task.TaskID)} - ${task.SourceType === 'PROJECT' ? 'Project task' : 'Standalone'}</div>
      </td>
      <td><span class="badge ${priorityBadgeClass_(task.Priority)}">${escapeHtml_(task.Priority)}</span></td>
      <td>${escapeHtml_(task.AssignedBy || '-')}</td>

function updateResultDynamic_() {
  const form = document.getElementById('task-result-form');
  if (!form) return;

  const status = form.elements.status.value;
  const progress = form.elements.progress;
  const waitingFields = document.getElementById('waiting-fields');
  const nextFields = document.getElementById('next-action-fields');

  waitingFields.classList.toggle('hidden', status !== 'WAITING');
  nextFields.classList.toggle('hidden', status === 'COMPLETED' || status === 'CANCELLED');

  if (status === 'COMPLETED') {
    progress.value = 100;
    progress.readOnly = true;
  } else if (status === 'CANCELLED') {
    progress.value = Number(form.dataset.currentProgress) || 0;
    progress.readOnly = true;
  } else {
    progress.readOnly = false;
    if (status === 'NOT_STARTED') progress.value = 0;
  }

  updateProgressReasonVisibility_();
}

function updateProgressReasonVisibility_() {
  const form = document.getElementById('task-result-form');
  const host = document.getElementById('progress-reason-field');
  if (!form || !host) return;

  const current = Number(form.dataset.currentProgress) || 0;
  const next = Number(form.elements.progress.value);
  const status = form.elements.status.value;
  host.classList.toggle('hidden', !(next < current && status !== 'CANCELLED'));
}

function showModal_(title, bodyHtml, actions) {
  const root = document.getElementById('overlay-root');
  root.innerHTML = `
    <div class="modal-backdrop">
      <div class="modal-card" role="dialog" aria-modal="true" aria-label="${escapeHtmlAttr_(title)}">
        <div class="modal-header">
          <div>
            <div class="panel-kicker">MYWORK</div>
            <h2>${escapeHtml_(title)}</h2>
          </div>
          <button class="modal-close" type="button" data-close-modal aria-label="Close">x</button>
        </div>
        <div class="modal-body">${bodyHtml}</div>
        <div class="modal-footer">
          ${(actions || []).map(action => action.close
            ? `<button type="button" class="${action.className || 'ghost-btn'}" data-close-modal>${escapeHtml_(action.label)}</button>`
            : `<button type="button" class="${action.className || 'primary-btn'}" data-modal-action="${escapeHtmlAttr_(action.action)}">${escapeHtml_(action.label)}</button>`
          ).join('')}
        </div>
      </div>
    </div>
  `;
}

function closeModal_() {
  document.getElementById('overlay-root').innerHTML = '';
}

function setModalBusy_(busy, label) {
  const root = document.getElementById('overlay-root');
  root.querySelectorAll('button, input, textarea, select').forEach(control => {
    control.disabled = Boolean(busy);
  });
  const action = root.querySelector('[data-modal-action]');
  if (!action) return;
  if (busy) {
    if (!action.dataset.originalText) action.dataset.originalText = action.textContent;
    action.textContent = label || 'Saving...';
  } else if (action.dataset.originalText) {
    action.textContent = action.dataset.originalText;
  }
}

function formObject_(form) {
  const data = new FormData(form);
  const output = {};
  data.forEach((value, key) => {
    output[key] = typeof value === 'string' ? value.trim() : value;
  });
  return output;
}

function validateForm_(form) {
  if (!form) return false;
  if (!form.reportValidity()) return false;
  return true;
}

function formField_(label, control, className) {
  return `
    <label class="form-field ${className || ''}">
      <span>${escapeHtml_(label)}</span>
      ${control}
    </label>
  `;
}

function userSelectHtml_(name, selected) {
  return `
    <select name="${escapeHtmlAttr_(name)}" required>
      ${STATE.users.map(user => `<option value="${escapeHtmlAttr_(user.UserID)}" ${String(user.UserID) === String(selected) ? 'selected' : ''}>${escapeHtml_(user.FullName || user.Email || user.UserID)}</option>`).join('')}
    </select>
  `;
}

function prioritySelectHtml_(name, selected) {
  return `
    <select name="${escapeHtmlAttr_(name)}" required>
      ${['HIGH', 'MEDIUM', 'LOW'].map(value => `<option value="${value}" ${value === selected ? 'selected' : ''}>${statusLabel_(value)}</option>`).join('')}
    </select>
  `;
}

function statusSelectHtml_(name, selected, currentStatus) {
  const statuses = allowedStatusOptions_(currentStatus);
  return `
    <select id="result-status" name="${escapeHtmlAttr_(name)}" required>
      ${statuses.map(value => `<option value="${value}" ${value === selected ? 'selected' : ''}>${statusLabel_(value)}</option>`).join('')}
    </select>
  `;
}

function allowedStatusOptions_(currentStatus) {
  const map = {
    NOT_STARTED: ['NOT_STARTED', 'IN_PROGRESS', 'WAITING', 'ON_HOLD', 'COMPLETED', 'CANCELLED'],
    IN_PROGRESS: ['IN_PROGRESS', 'WAITING', 'ON_HOLD', 'COMPLETED', 'CANCELLED'],
    WAITING: ['WAITING', 'IN_PROGRESS', 'ON_HOLD', 'COMPLETED', 'CANCELLED'],
    ON_HOLD: ['ON_HOLD', 'IN_PROGRESS', 'WAITING', 'COMPLETED', 'CANCELLED']
  };
  return map[currentStatus] || [currentStatus];
}

function renderResultSections_(result) {
  const sections = [
    ['COMPLETED WORK', result.CompletedWork],
    ['PENDING', result.PendingWork],
    ['ISSUES / CONSTRAINTS', result.IssuesConstraints],
    ['WAITING FOR', result.WaitingFor],
    ['NEXT ACTION', result.NextAction]
  ].filter(item => String(item[1] || '').trim());

  if (!sections.length) return `<div class="empty-inline">No commentary was entered in this update.</div>`;

  return sections.map(item => `
    <div class="result-section">
      <div class="result-section-label">${item[0]}</div>
      <div class="result-section-text">${nl2br_(item[1])}</div>
    </div>
  `).join('') + (result.NextActionDue ? `
    <div class="result-section">
      <div class="result-section-label">NEXT ACTION DUE</div>
      <div class="result-section-text">${escapeHtml_(formatDate_(result.NextActionDue))}</div>
    </div>
  ` : '') + (result.FollowUpDate ? `
    <div class="result-section">
      <div class="result-section-label">FOLLOW-UP</div>
      <div class="result-section-text">${escapeHtml_(formatDate_(result.FollowUpDate))}</div>

}

function showPageLoading_(text) {
  document.getElementById('page-content').innerHTML = renderLoading_(text);
}

function showToast_(message, tone) {
  const root = document.getElementById('toast-root');
  const toast = document.createElement('div');
  toast.className = `toast toast-${tone || 'info'}`;
  toast.textContent = message;
  root.appendChild(toast);
  requestAnimationFrame(() => toast.classList.add('show'));
  setTimeout(() => {
    toast.classList.remove('show');
    setTimeout(() => toast.remove(), 220);
  }, 3400);
}

function serverCall_(name, ...args) {
  return new Promise((resolve, reject) => {
    const runner = google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(error => reject(new Error(error && error.message ? error.message : String(error))));
    runner[name](...args);
  });
}

function isTaskActive_(task) {
  return !['COMPLETED', 'CANCELLED'].includes(String(task.Status || ''));
}

function statusLabel_(value) {
  return String(value || '')
    .toLowerCase()
    .split('_')
    .map(part => part ? part.charAt(0).toUpperCase() + part.slice(1) : '')
    .join(' ');
}

function statusBadgeClass_(status) {
  if (status === 'COMPLETED') return 'badge-success';
  if (status === 'WAITING' || status === 'ON_HOLD') return 'badge-warning';
  if (status === 'CANCELLED') return 'badge-neutral';
  return 'badge-info';
}

function priorityBadgeClass_(priority) {
  if (priority === 'HIGH') return 'badge-danger';
  if (priority === 'MEDIUM') return 'badge-warning';
  return 'badge-neutral';
}

function userName_(userId) {
  const user = STATE.users.find(item => String(item.UserID) === String(userId));
  return user ? (user.FullName || user.Email || user.UserID) : (userId || '-');
}

function formatDate_(iso) {
  if (!iso) return '-';
  const match = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(iso));
  if (!match) return String(iso);
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${Number(match[3])} ${months[Number(match[2]) - 1]} ${match[1]}`;
}

function nl2br_(value) {
  return escapeHtml_(value).replace(/\n/g, '<br>');
}

function escapeHtml_(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function escapeHtmlAttr_(value) {
  return escapeHtml_(value).replace(/`/g, '&#096;');
}

function compactStatV2_(label, value, danger) {

function renderMyWorkSectionsV2_(sections) {
  const need=sections.needAttention||[], today=sections.today||[], upcoming=sections.upcoming||[], waiting=sections.waiting||[];
  if (STATE.myWorkView==='OVERDUE') return renderWorkSectionV2_('Overdue', need.filter(t=>t.IsOverdue));
  if (STATE.myWorkView==='WAITING') return renderWorkSectionV2_('Waiting', waiting);
  if (STATE.myWorkView==='TODAY') return renderWorkSectionV2_('Need Attention',need)+renderWorkSectionV2_('Today',today);
  if (STATE.myWorkView==='ALL') return renderWorkSectionV2_('All Active Work',[].concat(need,today,upcoming,waiting));
  return renderWorkSectionV2_('Need Attention',need)+renderWorkSectionV2_('Today',today)+renderWorkSectionV2_('Upcoming',upcoming)+renderWorkSectionV2_('Waiting',waiting);
}

function renderWorkSectionV2_(title,tasks) {
  tasks=tasks||[];
  return `<section class="work-section-v2"><div class="work-section-head-v2"><h3>${escapeHtml_(title)}</h3><span class="work-count-v2">${tasks.length}</span></div><div class="work-list-v2">${tasks.length?tasks.map(renderWorkRowV2_).join(''):'<div class="empty-compact-v2">No items</div>'}</div></section>`;
}

function renderWorkRowV2_(task) {
  const reason=(task.AttentionReasons||[])[0];
  const context=[];
  if (task.ProjectName) context.push(escapeHtml_(task.ProjectName));
  if (task.NextAction) context.push('Next: '+escapeHtml_(task.NextAction));
  else if (task.Status==='IN_PROGRESS') context.push('Next action not defined');
  if (task.Status==='WAITING' && task.WaitingFor) context.push('Waiting for: '+escapeHtml_(task.WaitingFor));
  let right='';
  if (reason) right=`<span class="alert-v2">${escapeHtml_(reason.label)}</span>`;
  else if (task.Status==='WAITING') right=`<span class="waiting-v2">${task.FollowUpDate?'Follow-up '+formatDate_(task.FollowUpDate):'Waiting'}</span>`;
  else if (task.NextActionDue) right=`<span>${formatDate_(task.NextActionDue)}</span>`;
  else if (task.DueDate) right=`<span>${formatDate_(task.DueDate)}</span>`;
  return `<div class="work-row-v2" data-action="open-task" data-task-id="${escapeHtmlAttr_(task.TaskID)}"><div class="work-circle-v2"></div><div class="work-content-v2"><div class="work-title-v2">${escapeHtml_(task.TaskTitle)}</div><div class="work-meta-v2">${context.map(x=>`<span>${x}</span>`).join('')}</div></div><div class="work-right-v2">${right}<span>${Number(task.Progress)||0}%</span></div></div>`;
}

function taskRowLive_(task) {
  const priority=String(task.Priority||'MEDIUM').toLowerCase();

  return `<div class="task-row-v2" data-action="open-task" data-task-id="${escapeHtmlAttr_(task.TaskID)}"><div class="task-main-v2"><div class="task-title-line-v2"><span class="priority-dot-v2 ${priority}"></span><span class="task-title-v2">${escapeHtml_(task.TaskTitle)}</span></div><div class="task-sub-v2"><span>${escapeHtml_(task.TaskID)}</span>${context.map(x=>`<span>${x}</span>`).join('')}</div></div><div>${statusPillV2_(task.Status)}</div><div>${due}</div><div class="progress-mini-v2"><div class="progress-mini-track-v2"><div class="progress-mini-fill-v2" style="width:${progress}%"></div></div><span>${progress}%</span></div><div>${escapeHtml_(task.Priority||'MEDIUM')}</div></div>`;

function statusPillV2_(status) {
  const map={NOT_STARTED:['Not Started',''],IN_PROGRESS:['In Progress','in-progress'],WAITING:['Waiting','waiting'],ON_HOLD:['On Hold','waiting'],COMPLETED:['Completed','completed'],CANCELLED:['Cancelled','cancelled']};
  const info=map[status]||[status||'Unknown',''];
  return `<span class="status-pill-v2 ${info[1]}">${escapeHtml_(info[0])}</span>`;
}
