<script>
const KPI_INPUTS=[['sites','Vị trí trạm','Trạm'],['registered','Thuê bao reg lũy kế','Triệu TB'],['active','Thuê bao thực tại thị trường','Triệu TB'],['population','Dân số','Triệu dân'],['marketShare','Thị phần Viettel','%'],['arpuActual','ARPU tỷ giá thực tế','USD'],['arpuFixed','ARPU tỷ giá cố định','USD'],['arpu4g','ARPU 4G','USD'],['exchangeRate','Tỷ giá','Nội tệ/USD'],['dataSubsShare','Tỷ trọng TB Data','%'],['data4gShare','Tỷ trọng TB Data 4G','%'],['dou','DOU','GB'],['dou4g','DOU 4G','GB'],['dataPrice','Giá bán Data','USD/GB'],['dataCost','Giá thành Data','USD/GB'],['mouOutgoing','MOU đi (TB 15c3d)','Phút'],['voicePrice','Giá bán thoại nội mạng','Cent/phút'],['voiceCost','Giá thành thoại nội mạng','Cent/phút']];
function kpiCode_(c){return c==='VBD'?'VTB':c;}
function kpiGet_(c,code){return (c.kpi?.records||[]).find(r=>r.MarketCode===code&&Number(r.Year)===Number(c.year)&&Number(r.Month)===Number(c.month));}
function kpiRatio_(a,b,mult){return a==null||b==null||b===0?null:a/b*(mult==null?1:mult);}
function kpiValues_(c,code){const record=kpiGet_(c,code),v=record?JSON.parse(record.ValuesJSON):{},market=c.data.markets.find(m=>kpiCode_(m.ShortName)===code),a=code==='VTG'?mcVTGSource_(c,c.year,[Number(c.month)],'ACTUAL'):market?mcAggregate_(c.data.records,market.MarketID,c.year,[Number(c.month)],'ACTUAL',c.status):{};
 const share=c.compositionBasis!=='LIVE'&&v.originalDataShare!=null?v.originalDataShare:kpiRatio_(a.Data,a.Total,100);v.networkActive=kpiRatio_(v.active,v.marketShare,100);v.activePenetration=kpiRatio_(v.networkActive,v.population,100);v.peoplePerSite=kpiRatio_(v.population,v.sites,1e6);v.subsPerSite=kpiRatio_(v.registered,v.sites,1e6);v.regPenetration=kpiRatio_(kpiRatio_(v.registered,v.marketShare,100),v.population,100);v.viettelPenetration=kpiRatio_(v.registered,v.population,100);v.dataConsumptionShare=share;v.arpuData=share==null||v.arpuActual==null?null:share*v.arpuActual/100;v.dataMargin=kpiRatio_(v.dataPrice,v.dataCost,100);if(v.dataMargin!==null)v.dataMargin-=100;v.mouBoth=v.mouOutgoing==null?null:2*v.mouOutgoing;v.voiceDelta=v.voicePrice==null||v.voiceCost==null?null:v.voicePrice-v.voiceCost;v.voiceMargin=kpiRatio_(v.voicePrice,v.voiceCost,100);if(v.voiceMargin!==null)v.voiceMargin-=100;return v;}
function kpiRows_(){return [['#','Hạ tầng và thuê bao'],...KPI_INPUTS.slice(0,4),['networkActive','Thuê bao thực toàn mạng','Triệu TB'],['activePenetration','Mật độ TB thực / dân số','%'],['peoplePerSite','Số dân / vị trí','Dân'],['subsPerSite','Số thuê bao / vị trí','TB'],['#','Kết quả kinh doanh'],['regPenetration','Mật độ TB reg toàn mạng / dân số','%'],['viettelPenetration','Mật độ TB Viettel / dân số','%'],...KPI_INPUTS.slice(4,9),['#','Hành vi Data'],...KPI_INPUTS.slice(9,11),['dataConsumptionShare','Tỷ lệ tiêu dùng Data','%'],['arpuData','ARPU Data','USD'],...KPI_INPUTS.slice(11,15),['dataMargin','Lợi nhuận Data (giá bán / giá thành − 1)','%'],['#','Hành vi thoại'],['mouBoth','MOU 2 chiều (MOU đi × 2)','Phút'],...KPI_INPUTS.slice(15),['voiceDelta','Lợi nhuận thoại +/−','Cent/phút'],['voiceMargin','Lợi nhuận thoại (giá bán / giá thành − 1)','%']];}
function kpiColumns_(){return ['VTC','STL','NAT','MOV','VTL','VTP','VTB','VTZ','MYN','VTG','VTT'];}
function kpiTable_(title,columns,rows,values){return '<h3>'+escapeHtml_(title)+'</h3><div class="table-wrap kpi-matrix"><table class="data-table"><thead><tr><th>Chỉ tiêu</th><th>Đơn vị</th>'+columns.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>r[0]==='#'?'<tr class="kpi-section"><th colspan="'+(columns.length+2)+'">'+escapeHtml_(r[1])+'</th></tr>':'<tr><th>'+escapeHtml_(r[1])+'</th><td>'+escapeHtml_(r[2])+'</td>'+columns.map(code=>'<td>'+ (r[2]==='%'?mcPct_(values[code]?.[r[0]]):mcNum_(values[code]?.[r[0]]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function kpiComposition_(c,year,month){const result={};for(const code of kpiColumns_()){const m=c.data.markets.find(m=>kpiCode_(m.ShortName)===code);const r=code==='VTG'?mcVTGSource_(c,year,[month],'ACTUAL'):m?mcAggregate_(c.data.records,m.MarketID,year,[month],'ACTUAL',c.status):{};result[code]={};for(const k of ['Voice','SMS','Data','VAS'])result[code][k]=kpiRatio_(r[k],r.Total,100);const snapshot=(c.kpi?.records||[]).find(x=>x.MarketCode===code&&Number(x.Year)===Number(year)&&Number(x.Month)===Number(month)),original=snapshot?JSON.parse(snapshot.ValuesJSON):{};if(c.compositionBasis!=='LIVE')for(const k of ['Voice','SMS','Data','VAS'])if(original['original'+k+'Share']!=null)result[code][k]=original['original'+k+'Share'];result[code].Total=r.Total;}return result;}
function kpiReport_(c){const cols=kpiColumns_(),values=Object.fromEntries(cols.map(code=>[code,kpiValues_(c,code)]));let html=mcToolbar_(c).replace('id="mc-market"','id="mc-market" disabled').replace('Số liệu<select','Trạng thái tiêu dùng<select')+'<label>Cơ cấu tiêu dùng<select id="kpi-basis">'+mcOptions_([['SOURCE','Theo sheet mẫu (nếu có)'],['LIVE','Theo dữ liệu tiêu dùng']],c.compositionBasis||'SOURCE')+'</select></label><section id="kpi-report"><h2>Tổng quan thị trường và KPI sản phẩm</h2><p>Tháng '+c.month+'/'+c.year+' · Chỉ tiêu tại kỳ báo cáo, không cộng dồn tỷ lệ hoặc thuê bao.</p><div class="productivity-toolbar-v2 kpi-controls"><button class="secondary-btn" data-action="mc-kpi-export">Xuất CSV báo cáo</button><button class="secondary-btn" data-action="mc-kpi-import">Nhập KPI từ file</button><button class="primary-btn" data-action="mc-kpi-edit">Nhập / sửa KPI tháng</button></div>';
 if(!c.kpi?.ready)html+='<p>Chưa khởi tạo dữ liệu KPI. <button data-action="mc-kpi-init">Bật lưu KPI</button></p>';
 html+='<p class="work-context">NAT = NCM, MOV = MVT, VTB = VBD. VTT là cột tham chiếu Việt Nam. VTG chỉ hiển thị cơ cấu tiêu dùng gốc; không cộng hoặc lấy trung bình ARPU, DOU và thị phần các nước. “—” là chưa có số hoặc không tính được.</p>'+kpiTable_('1. Tổng hợp số liệu các thị trường',cols,kpiRows_(),values);
 html+='<p><strong>Mốc KPI:</strong> các số hạ tầng, dân số, giá thành và thị phần có thể dùng kỳ tham chiếu khác tháng báo cáo; xem chi tiết nguồn bên dưới. KPI nhập bổ sung hiện là số nháp.</p><details><summary>Nguồn và mốc tham chiếu KPI</summary>'+cols.map(code=>{const r=kpiGet_(c,code);return r?'<p><strong>'+code+'</strong>: '+escapeHtml_(r.Source)+' · '+escapeHtml_(Object.entries(JSON.parse(r.ReferenceJSON||'{}')).map(([k,v])=>(KPI_INPUTS.find(x=>x[0]===k)?.[1]||k)+': '+v).join('; '))+' · Nháp <button data-action="mc-kpi-history" data-record-id="'+escapeHtmlAttr_(r.RecordID)+'">Lịch sử</button></p>':'';}).join('')+'</details><p class="work-context">Số liên kết ngoài được lưu theo bản chụp của file, chưa cập nhật nguồn ngoài. Cơ cấu theo sheet mẫu ưu tiên tỷ lệ gốc đã lưu; kỳ chưa có tỷ lệ gốc sẽ tính từ dữ liệu tiêu dùng. Chọn Theo dữ liệu tiêu dùng để tính lại toàn bộ. Nguồn cơ cấu đang chọn áp dụng cho tỷ lệ tiêu dùng Data và ARPU Data; Tổng gốc và cảnh báo lệch cơ cấu được giữ nguyên trong báo cáo tiêu dùng. Các bảng phụ và ô #REF! của file không dùng làm nguồn tính.</p>';
 const compRows=['Voice','SMS','Data','VAS'].map(k=>[k,k==='Voice'?'Thoại':k,'%']);html+=kpiTable_('2. Cơ cấu tiêu dùng · T'+c.month+'/'+c.year,cols,compRows,kpiComposition_(c,Number(c.year),Number(c.month)));
 for(let y=Number(c.year)-1;y>=Math.max(2018,Number(c.year)-8);y--)html+=kpiTable_('Cơ cấu tiêu dùng · T12/'+y,cols,compRows,kpiComposition_(c,y,12));return html+'</section>';}
async function kpiLoad_(){const c=consumptionState_();try{c.kpi=await serverCall_('apiListMarketKpi');renderCurrentPage_();}catch(e){showToast_(e.message,'error');}}
function kpiEdit_(){const c=consumptionState_();c.kpiCode=c.kpiCode||'VTC';const r=kpiGet_(c,c.kpiCode),v=r?JSON.parse(r.ValuesJSON):{},refs=r?JSON.parse(r.ReferenceJSON||'{}'):{};c.kpiRevision=r?.Revision||0;
 showModal_('KPI thị trường · T'+c.month+'/'+c.year,'<form id="kpi-form" onsubmit="return false">'+formField_('Thị trường','<select id="kpi-form-code">'+mcOptions_(kpiColumns_().filter(x=>x!=='VTG').map(x=>[x,x]),c.kpiCode)+'</select>')+'<div class="form-grid-2">'+KPI_INPUTS.map(([k,label,unit])=>formField_(label+' ('+unit+')',mcInput_(k,v[k],'number','min="0" step="'+(k==='sites'?'1':'any')+'" '+(unit==='%'?'max="100"':'')))).join('')+'</div><h3>Mốc tham chiếu (nếu khác tháng báo cáo)</h3>'+['sites','population','marketShare','dataCost','voiceCost'].map(k=>formField_(KPI_INPUTS.find(x=>x[0]===k)[1],mcInput_('ref_'+k,refs[k],'text','maxlength="200"'))).join('')+formField_('Nguồn',mcInput_('source',r?.Source,'text','maxlength="2000"'))+formField_('Ghi chú',mcInput_('note',r?.Note,'text','maxlength="2000"'))+'</form>',[{label:'Hủy',className:'ghost-btn',close:true},{label:'Lưu KPI',className:'primary-btn',action:'kpi-save'}]);}
async function kpiSave_(){const c=consumptionState_(),form=document.getElementById('kpi-form');if(c.saving||!validateForm_(form))return;const raw=formObject_(form),input={marketCode:c.kpiCode,year:c.year,month:c.month,revision:c.kpiRevision,values:{},references:{},source:raw.source,note:raw.note};const existing=kpiGet_(c,c.kpiCode);if(existing)Object.assign(input.values,JSON.parse(existing.ValuesJSON));KPI_INPUTS.forEach(([k])=>input.values[k]=raw[k]);Object.keys(raw).filter(k=>k.startsWith('ref_')).forEach(k=>input.references[k.slice(4)]=raw[k]);await kpiPersist_([input]);}
async function kpiPersist_(inputs){const c=consumptionState_();if(c.saving)return;c.saving=true;setModalBusy_(true,'Đang lưu KPI...');try{for(let i=0;i<inputs.length;i+=50){const result=await serverCall_('apiSaveMarketKpi',inputs.slice(i,i+50));c.kpi.records=c.kpi.records.filter(r=>!result.records.some(x=>x.RecordID===r.RecordID)).concat(result.records);}closeModal_();renderCurrentPage_();showToast_('Đã lưu và đọc lại KPI.','success');}catch(e){setModalBusy_(false);showToast_(e.message,'error');}finally{c.saving=false;}}
function kpiImport_(){showModal_('Nhập KPI theo kỳ','<p>Dán JSON KPI đã chuẩn hóa. Xem trước số kỳ mới/thay thế trước khi lưu. Nếu một lô lỗi, các lô trước vẫn đã lưu.</p><textarea id="kpi-import-text" rows="12" aria-label="JSON KPI"></textarea>',[{label:'Hủy',close:true,className:'ghost-btn'},{label:'Xem trước',className:'secondary-btn',action:'kpi-preview'}]);}
function kpiPreview_(){try{const rows=JSON.parse(document.getElementById('kpi-import-text').value);if(!Array.isArray(rows)||!rows.length||rows.length>200)throw Error('Nhập từ 1–200 kỳ');const existing=consumptionState_().kpi?.records||[];rows.forEach(r=>{const old=existing.find(x=>x.MarketCode===kpiCode_(r.marketCode)&&Number(x.Year)===Number(r.year)&&Number(x.Month)===Number(r.month));r.revision=old?Number(old.Revision):0;});consumptionState_().kpiImport=rows;showModal_('Xác nhận dữ liệu KPI','<p>'+rows.length+' kỳ ('+rows.filter(r=>r.revision>0).length+' kỳ thay thế). Đơn vị theo từng chỉ tiêu; tỷ lệ nhập từ 0–100.</p><div class="table-wrap"><table class="data-table"><tr><th>Thị trường</th><th>Kỳ</th><th>KPI</th><th>Nguồn</th></tr>'+rows.map(r=>'<tr><td>'+escapeHtml_(r.marketCode)+'</td><td>'+escapeHtml_(r.month+'/'+r.year)+'</td><td>'+Object.values(r.values||{}).filter(v=>v!=null&&v!=='').length+'</td><td>'+escapeHtml_(r.source)+'</td></tr>').join('')+'</table></div>',[{label:'Hủy',close:true,className:'ghost-btn'},{label:'Lưu dữ liệu',className:'primary-btn',action:'kpi-import-save'}]);}catch(e){showToast_(e.message,'error');}}
async function kpiHistory_(id){try{const rows=await serverCall_('apiMarketKpiHistory',id);showModal_('Lịch sử KPI',rows.map(r=>'<p>'+escapeHtml_(r.CreatedAt)+' · '+escapeHtml_(r.UserID)+'</p><pre class="mc-history">'+escapeHtml_(r.OldValue)+' → '+escapeHtml_(r.NewValue)+'</pre>').join(''),[{label:'Đóng',close:true,className:'ghost-btn'}]);}catch(e){showToast_(e.message,'error');}}
function kpiExport_(){const c=consumptionState_(),cols=kpiColumns_(),values=Object.fromEntries(cols.map(x=>[x,kpiValues_(c,x)])),rows=[['Tháng',c.month,'Năm',c.year,'Cơ cấu',c.compositionBasis||'SOURCE'],['Chỉ tiêu','Đơn vị',...cols],...kpiRows_().map(r=>r[0]==='#'?[r[1]]:[r[1],r[2],...cols.map(x=>values[x][r[0]]??'')])];for(let y=Number(c.year);y>=Math.max(2018,Number(c.year)-8);y--){const month=y===Number(c.year)?Number(c.month):12,v=kpiComposition_(c,y,month);rows.push(['Cơ cấu T'+month+'/'+y]);for(const k of ['Voice','SMS','Data','VAS'])rows.push([k,'%',...cols.map(x=>v[x][k]??'')]);}const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='TH_thi_truong_'+c.year+'_'+c.month+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
</script>
