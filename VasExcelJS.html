<script>

async function vasExcelExport_(button){if(button?.disabled)return;try{if(button){button.disabled=true;button.textContent='Đang xuất Excel…';}await new Promise(r=>setTimeout(r,20));const result=vasExcelBuild_(consumptionState_()),url=URL.createObjectURL(new Blob([result.bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');a.href=url;a.download=result.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);showToast_('Đã tạo file Excel gồm bảng và biểu đồ.','success');}catch(e){showToast_('Không xuất được Excel: '+e.message,'error');}finally{if(button){button.disabled=false;button.textContent='Xuất Excel · Bảng & biểu đồ';}}}
