<script>
// Build the workbook locally: the export uses the same calculated snapshot as the UI.
function vasExcelXml_(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function vasExcelBuild_(c){
 const mode=vasMode_(c),year=Number(c.year),period=vasSelected_(c),label=mode==='MONTH'?'T'+period:mode==='YEAR'?'Nam':'Q'+period,n=mode==='MONTH'?12:mode==='YEAR'?1:4,years=[year-2,year-1,year],wb=XLSX.utils.book_new(),pct=v=>v==null?null:v/100;
 const table=[['BÁO CÁO VAS · '+label+'/'+year],['Đơn vị: nghìn USD · '+(c.status==='FINAL'?'Chỉ đã chốt':'Gồm số nháp')],['YoY: cùng kỳ năm trước. QoQ: quý liền trước. VTG dùng số gốc.'],[],['Đơn vị','Doanh thu VAS','TDG','VAS / TDG','VAS cùng kỳ năm trước','YoY',...(mode==='QUARTER'?['QoQ']:[]),'Cảnh báo cùng kỳ','Dữ liệu']];
 vasRows_(c).forEach(r=>table.push([r.market.ShortName,r.revenue,r.total,pct(r.share),r.lastYear,pct(r.yoy),...(mode==='QUARTER'?[pct(r.qoq)]:[]),r.alert.text,(r.annual?'Số tổng năm gốc':r.count+'/'+r.expected+' tháng')+(r.draft?' · Nháp':'')+(r.mismatch?' · Cơ cấu chưa khớp':'')]));
 const summary=XLSX.utils.aoa_to_sheet(table);summary['!cols']=[{wch:14},{wch:20},{wch:20},{wch:14},{wch:24},{wch:14},...(mode==='QUARTER'?[{wch:14}]:[]),{wch:48},{wch:35}];summary['!rows']=table.map((_,i)=>({hpt:i===4?32:24}));
 for(let r=5;r<table.length;r++)for(let col=1;col<(mode==='QUARTER'?7:6);col++){const cell=summary[XLSX.utils.encode_cell({r,c:col})];if(cell)cell.z=[3,5,6].includes(col)?'0.0%':'#,##0.00';}
 XLSX.utils.book_append_sheet(wb,summary,'Bao cao VAS');
 const data=[['DOANH THU VAS · '+years[0]+'–'+year],['Đơn vị: nghìn USD. Ô trống = chưa đủ dữ liệu.'],['Biểu đồ theo bộ lọc đơn vị đang chọn trên Web.']],specs=[];
 vasMarkets_(c).filter(m=>!c.vasMarket||m.MarketID===c.vasMarket).forEach(m=>{const start=data.length;data.push([m.ShortName+' · '+(m.Country||'')],['Kỳ',...years.map(String)]);const vals=years.map(y=>Array.from({length:n},(_,i)=>vasCompare_(c,m.MarketID,y,i+1)));for(let i=0;i<n;i++)data.push([mode==='MONTH'?'T'+(i+1):mode==='YEAR'?'Cả năm':'Q'+(i+1),...vals.map(a=>a[i].revenue)]);if(vals.some(a=>a.some(v=>v.revenue!=null)))specs.push({title:m.ShortName+' · '+(m.Country||'')+' · nghìn USD',start:start+3,n,vals});else data.push(['Chưa có dữ liệu; không dựng biểu đồ bằng số 0.']);data.push([],['YoY',...years.map(String)]);for(let i=0;i<n;i++)data.push([mode==='MONTH'?'T'+(i+1):mode==='YEAR'?'Cả năm':'Q'+(i+1),...vals.map(a=>pct(a[i].yoy))]);data.push([]);});
 const ds=XLSX.utils.aoa_to_sheet(data);ds['!cols']=[{wch:30},{wch:20},{wch:20},{wch:20}];let isPct=false;data.forEach((row,r)=>{if(row[0]==='YoY')isPct=true;else if(!row.length)isPct=false;for(let j=1;j<=3;j++){const cell=ds[XLSX.utils.encode_cell({r,c:j})];if(cell&&cell.t==='n')cell.z=isPct?'0.0%':'#,##0.00';}});XLSX.utils.book_append_sheet(wb,ds,'Du lieu bieu do');
 const bs=XLSX.utils.aoa_to_sheet([['BIỂU ĐỒ VAS · '+years[0]+'–'+year],['Chọn biểu đồ → Copy → dán vào Word. Biểu đồ liên kết với sheet Du lieu bieu do.'],...(!specs.length?[['Không có dữ liệu cho đơn vị và kỳ đang chọn.']]:[])]);bs['!cols']=Array.from({length:12},()=>({wch:12}));XLSX.utils.book_append_sheet(wb,bs,'Bieu do');
 const zip=XLSX.CFB.read(new Uint8Array(XLSX.write(wb,{bookType:'xlsx',type:'array'})),{type:'array'}),enc=new TextEncoder(),dec=new TextDecoder(),get=p=>dec.decode(XLSX.CFB.find(zip,zip.FullPaths[0]+p).content),put=(p,s)=>XLSX.CFB.utils.cfb_add(zip,p,enc.encode(s)),xml=vasExcelXml_,ns='http://schemas.openxmlformats.org/drawingml/2006/chart',rel='http://schemas.openxmlformats.org/officeDocument/2006/relationships';
 if(specs.length){let anchors='',rels='',types='';specs.forEach((s,index)=>{const id=index+1,colors=['9AAEC6','4895CE','245AC2'];let series='';years.forEach((y,j)=>{const col=String.fromCharCode(66+j),ref="'Du lieu bieu do'!$"+col+'$'+s.start+':$'+col+'$'+(s.start+n-1);series+='<c:ser><c:idx val="'+j+'"/><c:order val="'+j+'"/><c:tx><c:v>'+y+'</c:v></c:tx><c:spPr><a:solidFill><a:srgbClr val="'+colors[j]+'"/></a:solidFill></c:spPr><c:cat><c:strRef><c:f>'+xml("'Du lieu bieu do'!$A$"+s.start+':$A$'+(s.start+n-1))+'</c:f><c:strCache><c:ptCount val="'+n+'"/>'+s.vals[j].map((_,k)=>'<c:pt idx="'+k+'"><c:v>'+xml(data[s.start-1+k][0])+'</c:v></c:pt>').join('')+'</c:strCache></c:strRef></c:cat><c:val><c:numRef><c:f>'+xml(ref)+'</c:f><c:numCache><c:formatCode>#,##0.00</c:formatCode><c:ptCount val="'+n+'"/>'+s.vals[j].map((v,k)=>v.revenue==null?'':'<c:pt idx="'+k+'"><c:v>'+v.revenue+'</c:v></c:pt>').join('')+'</c:numCache></c:numRef></c:val></c:ser>';});
 put('xl/charts/chart'+id+'.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><c:chartSpace xmlns:c="'+ns+'" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><c:chart><c:title><c:tx><c:rich><a:bodyPr/><a:lstStyle/><a:p><a:r><a:t>'+xml(s.title)+'</a:t></a:r></a:p></c:rich></c:tx></c:title><c:plotArea><c:layout/><c:barChart><c:barDir val="col"/><c:grouping val="clustered"/>'+series+'<c:gapWidth val="90"/><c:axId val="1"/><c:axId val="2"/></c:barChart><c:catAx><c:axId val="1"/><c:scaling><c:orientation val="minMax"/></c:scaling><c:axPos val="b"/><c:crossAx val="2"/></c:catAx><c:valAx><c:axId val="2"/><c:scaling><c:orientation val="minMax"/><c:min val="0"/></c:scaling><c:axPos val="l"/><c:majorGridlines/><c:numFmt formatCode="#,##0" sourceLinked="0"/><c:crossAx val="1"/></c:valAx></c:plotArea><c:legend><c:legendPos val="t"/></c:legend><c:plotVisOnly val="1"/><c:dispBlanksAs val="gap"/></c:chart></c:chartSpace>');
 const row=4+index*24;anchors+='<xdr:twoCellAnchor><xdr:from><xdr:col>0</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>'+row+'</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:to><xdr:col>12</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>'+(row+22)+'</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:to><xdr:graphicFrame macro=""><xdr:nvGraphicFramePr><xdr:cNvPr id="'+id+'" name="VAS '+id+'"/><xdr:cNvGraphicFramePr/></xdr:nvGraphicFramePr><xdr:xfrm><a:off x="0" y="0"/><a:ext cx="0" cy="0"/></xdr:xfrm><a:graphic><a:graphicData uri="'+ns+'"><c:chart xmlns:c="'+ns+'" xmlns:r="'+rel+'" r:id="rId'+id+'"/></a:graphicData></a:graphic></xdr:graphicFrame><xdr:clientData/></xdr:twoCellAnchor>';rels+='<Relationship Id="rId'+id+'" Type="'+rel+'/chart" Target="../charts/chart'+id+'.xml"/>';types+='<Override PartName="/xl/charts/chart'+id+'.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.chart+xml"/>';});
 put('xl/drawings/drawing1.xml','<?xml version="1.0" encoding="UTF-8"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">'+anchors+'</xdr:wsDr>');put('xl/drawings/_rels/drawing1.xml.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+rels+'</Relationships>');put('xl/worksheets/_rels/sheet3.xml.rels','<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="'+rel+'/drawing" Target="../drawings/drawing1.xml"/></Relationships>');put('xl/worksheets/sheet3.xml',get('xl/worksheets/sheet3.xml').replace('</worksheet>','<drawing r:id="rId1"/></worksheet>'));put('[Content_Types].xml',get('[Content_Types].xml').replace('</Types>',types+'<Override PartName="/xl/drawings/drawing1.xml" ContentType="application/vnd.openxmlformats-officedocument.drawingml.drawing+xml"/></Types>'));
 }
 return {bytes:XLSX.CFB.write(zip,{fileType:'zip',type:'array',compression:true}),name:'VAS_'+label+'_'+year+'.xlsx'};
}
async function vasExcelExport_(button){if(button?.disabled)return;try{if(button){button.disabled=true;button.textContent='Đang xuất Excel…';}await new Promise(r=>setTimeout(r,20));const result=vasExcelBuild_(consumptionState_()),url=URL.createObjectURL(new Blob([result.bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),a=document.createElement('a');a.href=url;a.download=result.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);showToast_('Đã tạo file Excel gồm bảng và biểu đồ.','success');}catch(e){showToast_('Không xuất được Excel: '+e.message,'error');}finally{if(button){button.disabled=false;button.textContent='Xuất Excel · Bảng & biểu đồ';}}}
</script>
