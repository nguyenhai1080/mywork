<script>
function vasMarkets_(c){return [{MarketID:'VTG',ShortName:'VTG',Country:'Công ty mẹ'},...c.data.markets.filter(m=>!['VTG','VTCM'].includes(m.ShortName)&&!String(m.ShortName).startsWith('TEST'))];}
function vasQuarter_(c,id,year,quarter){return vasValue_({...c,vasMode:'QUARTER'},id,year,quarter);}
function vasGrowth_(current,previous){return current==null||previous==null||previous<=0?null:(current/previous-1)*100;}
function vasPeriod_(c,id,year,q){const a=vasQuarter_(c,id,year,q),p=vasQuarter_(c,id,q===1?year-1:year,q===1?4:q-1);return {...a,previous:p.revenue,qoq:vasGrowth_(a.revenue,p.revenue)};}
function vasMode_(c){return c.vasMode||'QUARTER';}
// Only the untouched draft placeholders from the approved July 2026 workbook are unavailable.
// A later edit (Revision > 1), FINAL record, or explicit manual zero remains actual data.
function vasPlaceholder_(r){return Number(r.Year)===2026&&Number(r.Month)>=8&&Number(r.Month)<=12&&r.Scenario==='ACTUAL'&&r.Status==='DRAFT'&&Number(r.Revision)===1&&String(r.Source||'').startsWith('TD thuc.xlsx | TD thuc!')&&['Total','Voice','SMS','Data','VAS'].every(k=>r[k]!==''&&r[k]!=null&&Number(r[k])===0);}
function vasValue_(c,id,year,period){const mode=vasMode_(c),months=mode==='MONTH'?[period]:mode==='YEAR'?Array.from({length:12},(_,i)=>i+1):[period*3-2,period*3-1,period*3],r=mcAggregate_((id==='VTG'?(c.data.vtgRecords||[]):c.data.records).filter(r=>!vasPlaceholder_(r)),id,year,months,'ACTUAL',c.status);return {revenue:r.VAS,total:r.Total,share:r.VAS!==null&&r.Total>0?r.VAS/r.Total*100:null,count:r.count,expected:months.length,annual:r.annual,draft:r.draft,mismatch:r.mismatch};}
function vasSelected_(c){return vasMode_(c)==='MONTH'?Number(c.vasMonth||c.month):vasMode_(c)==='YEAR'?1:Number(c.vasQuarter||Math.ceil(Number(c.month)/3));}
function vasCompare_(c,id,year,period){const a=vasValue_(c,id,year,period),b=vasValue_(c,id,year-1,period);return {...a,lastYear:b.revenue,yoy:vasGrowth_(a.revenue,b.revenue),...(vasMode_(c)==='QUARTER'?vasPeriod_(c,id,year,period):{})};}
function vasAlert_(growth,groupGrowth,isGroup){if(growth==null)return {flag:false,text:'Chưa đủ dữ liệu YoY'};if(growth<0)return {flag:true,text:'Cảnh báo: tăng trưởng âm (YoY)'};if(isGroup)return {flag:false,text:'Mốc so sánh VTG'};if(groupGrowth==null)return {flag:false,text:'Thiếu YoY VTG để đối chiếu'};if(groupGrowth<=0)return {flag:false,text:'VTG không tăng trưởng dương; không xét gấp 2'};return {flag:growth>=2*groupGrowth,text:growth>=2*groupGrowth?'Cảnh báo: ≥ 2 × YoY VTG':'Trong ngưỡng'};}
function vasRows_(c){const year=Number(c.year),p=vasSelected_(c),vtg=vasCompare_(c,'VTG',year,p);return vasMarkets_(c).map(m=>{const a=vasCompare_(c,m.MarketID,year,p);return {market:m,...a,alert:a.revenue===null?{flag:false,text:'Chưa đủ kỳ — chưa xét cảnh báo'}:vasAlert_(a.yoy,vtg.yoy,m.MarketID==='VTG')};});}
function vasChart_(c,m){const mode=vasMode_(c),n=mode==='MONTH'?12:mode==='YEAR'?1:4,step=mode==='MONTH'?90:117,width=mode==='MONTH'?1180:560,label=i=>mode==='MONTH'?'T'+(i+1):mode==='YEAR'?'Cả năm':'Q'+(i+1);const years=[Number(c.year)-2,Number(c.year)-1,Number(c.year)],series=years.map(y=>Array.from({length:n},(_,i)=>vasCompare_(c,m.MarketID,y,i+1))),known=series.flat().map(x=>x.revenue).filter(x=>x!==null),max=Math.max(1,...known),colors=['#9aaec6','#4895ce','#245ac2'];let svg='<svg style="min-width:'+width+'px" viewBox="0 0 '+width+' 270" role="img" aria-label="Doanh thu VAS '+escapeHtmlAttr_(m.ShortName)+'"><title>Doanh thu VAS '+escapeHtml_(m.ShortName)+' · nghìn USD</title>';
 for(let i=0;i<=4;i++){const y=220-i*45;svg+='<line x1="70" y1="'+y+'" x2="'+(width-15)+'" y2="'+y+'" stroke="#dce4ed"/><text x="64" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#526476">'+mcNum_(max*i/4)+'</text>';}
 for(let q=0;q<n;q++){svg+='<text x="'+(125+q*step)+'" y="245" text-anchor="middle" font-size="13">'+label(q)+'</text>';for(let y=0;y<3;y++){const r=series[y][q],x=83+q*step+y*27;if(r.revenue===null){svg+='<text x="'+(x+10)+'" y="215" text-anchor="middle" fill="#708090">—</text>';continue;}const h=r.revenue/max*180;svg+='<rect x="'+x+'" y="'+(220-h)+'" width="23" height="'+Math.max(h,1)+'" fill="'+colors[y]+'"><title>'+years[y]+' '+label(q)+': '+mcNum_(r.revenue)+' nghìn USD; YoY '+mcPct_(r.yoy)+'</title></rect>';}}
 svg+='</svg>';return '<article class="vas-card"><h3>'+escapeHtml_(m.ShortName)+' · '+escapeHtml_(m.Country||'')+'</h3><div class="vas-legend">'+years.map((y,i)=>'<span><i style="background:'+colors[i]+'"></i>'+y+'</span>').join('')+'</div><div class="vas-plot-scroll">'+svg+'</div><div class="table-wrap"><table class="data-table"><thead><tr><th>YoY</th>'+Array.from({length:n},(_,i)=>'<th>'+label(i)+'</th>').join('')+'</tr></thead><tbody>'+years.map((y,i)=>'<tr><th>'+y+'</th>'+series[i].map(r=>'<td>'+mcPct_(r.yoy)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></article>';}
function vasReport_(c){const mode=vasMode_(c),p=vasSelected_(c),name=mode==='MONTH'?'tháng':mode==='YEAR'?'năm':'quý',label=mode==='MONTH'?'T'+p+'/'+c.year:mode==='YEAR'?c.year:'Q'+p+'/'+c.year,rows=vasRows_(c),cards=vasMarkets_(c).filter(m=>!c.vasMarket||m.MarketID===c.vasMarket);return '<div class="filter-tabs" role="tablist" aria-label="Kỳ báo cáo VAS">'+[['MONTH','Báo cáo tháng'],['QUARTER','Báo cáo quý'],['YEAR','Báo cáo năm']].map(([id,text])=>'<button role="tab" aria-selected="'+(mode===id)+'" class="secondary-btn '+(mode===id?'active':'')+'" data-action="vas-mode" data-mode="'+id+'">'+text+'</button>').join('')+'</div><div class="mc-toolbar"><label>Năm<input id="mc-year" type="number" min="2002" max="2100" required value="'+c.year+'"></label>'+(mode==='YEAR'?'':'<label>'+ (mode==='MONTH'?'Tháng':'Quý')+'<select id="'+(mode==='MONTH'?'vas-month':'vas-quarter')+'">'+mcOptions_(Array.from({length:mode==='MONTH'?12:4},(_,i)=>[i+1,(mode==='MONTH'?'T':'Q')+(i+1)]),p)+'</select></label>')+'<label>Số liệu<select id="mc-status">'+mcOptions_([['ALL','Gồm số nháp'],['FINAL','Chỉ đã chốt']],c.status)+'</select></label><span>Cơ sở cảnh báo: <strong>Cùng '+name+' năm trước (YoY)</strong></span></div><h2>Báo cáo VAS theo '+name+' · '+label+'</h2><p>Đơn vị: <strong>nghìn USD</strong>. Tỷ trọng = VAS / TDG gốc. YoY = tăng trưởng so với cùng '+name+' năm trước.</p><button class="secondary-btn" data-action="mc-vas-export">Xuất CSV VAS</button><div class="table-wrap"><table class="data-table"><thead><tr><th>Đơn vị</th><th>Doanh thu VAS</th><th>TDG</th><th>VAS / TDG</th><th>VAS cùng kỳ năm trước</th><th>Tăng trưởng so với cùng '+name+' năm trước</th><th>Cảnh báo cùng kỳ</th><th>Dữ liệu</th></tr></thead><tbody>'+rows.map(r=>'<tr class="'+(r.alert.flag?'vas-alert':'')+'"><th>'+escapeHtml_(r.market.ShortName)+'</th><td>'+mcNum_(r.revenue)+'</td><td>'+mcNum_(r.total)+'</td><td>'+mcPct_(r.share)+'</td><td>'+mcNum_(r.lastYear)+'</td><td>'+mcPct_(r.yoy)+'</td>'+'<td>'+r.alert.text+'</td><td>'+(r.annual?'Số tổng năm gốc':r.count+'/'+r.expected+' tháng')+(r.draft?' · Nháp':'')+(r.mismatch?' · Cơ cấu chưa khớp':'')+'</td></tr>').join('')+'</tbody></table></div><p class="work-context">Cảnh báo khi YoY âm (kể cả VTG), hoặc YoY nhà mạng ≥ 2 × YoY VTG khi VTG tăng trưởng dương. Thiếu dữ liệu hoặc mẫu số không dương: không tính tăng trưởng. Năm so sánh cả năm với cả năm, không tự đổi sang lũy kế. Kỳ chưa đủ dữ liệu hiển thị “—”, không tính YoY/QoQ và không phát cảnh báo. Bản nguồn TD thuc.xlsx mới có thực hiện đến T7/2026: các dòng nháp toàn 0 từ T8–T12/2026 chưa được cập nhật được coi là chưa nhập. Số 0 thực tế đã được cập nhật hoặc chốt vẫn được tính. VTG dùng số gốc riêng.</p><h2>Doanh thu theo '+name+' · '+(Number(c.year)-2)+'–'+c.year+'</h2><label>Biểu đồ đơn vị<select id="vas-market">'+mcOptions_([['','VTG và tất cả thị trường'],...vasMarkets_(c).map(m=>[m.MarketID,m.ShortName])],c.vasMarket||'')+'</select></label><p class="work-context">So sánh 3 năm liền kề. Di chuột vào cột để xem doanh thu và YoY; thang doanh thu riêng cho từng đơn vị.</p><div class="vas-charts">'+cards.map(m=>vasChart_(c,m)).join('')+'</div>';}
function vasExport_(){const c=consumptionState_(),mode=vasMode_(c),rows=[['Market','Year','Period','Unit','VAS','TDG','VAS_TDG_Percent','Prior_Year_VAS','YoY_Percent','QoQ_Percent','Alert','Months','Annual_Source','Draft','Mismatch']];for(let y=Number(c.year)-2;y<=Number(c.year);y++)for(let p=1;p<=(mode==='MONTH'?12:mode==='YEAR'?1:4);p++)for(const r of vasRows_({...c,year:y,vasQuarter:p,vasMonth:p}))rows.push([r.market.ShortName,y,mode==='YEAR'?'YEAR':(mode==='MONTH'?'M':'Q')+p,'USD_THOUSAND',r.revenue,r.total,r.share,r.lastYear,r.yoy,r.qoq,r.alert.text,r.count,r.annual,r.draft,r.mismatch]);const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='VAS_'+mode+'_'+(Number(c.year)-2)+'_'+c.year+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
</script>
