<script>
function vasMarkets_(c){return [{MarketID:'VTG',ShortName:'VTG',Country:'Công ty mẹ'},...c.data.markets.filter(m=>!['VTG','VTCM'].includes(m.ShortName)&&!String(m.ShortName).startsWith('TEST'))];}
function vasQuarter_(c,id,year,quarter){const months=[quarter*3-2,quarter*3-1,quarter*3],records=id==='VTG'?(c.data.vtgRecords||[]):c.data.records,r=mcAggregate_(records,id,year,months,'ACTUAL',c.status);return {revenue:r.VAS,total:r.Total,share:r.VAS!==null&&r.Total>0?r.VAS/r.Total*100:null,count:r.count,draft:r.draft,mismatch:r.mismatch};}
function vasGrowth_(current,previous){return current==null||previous==null||previous<=0?null:(current/previous-1)*100;}
function vasPeriod_(c,id,year,q){const a=vasQuarter_(c,id,year,q),p=vasQuarter_(c,id,q===1?year-1:year,q===1?4:q-1);return {...a,previous:p.revenue,qoq:vasGrowth_(a.revenue,p.revenue)};}
function vasAlert_(growth,groupGrowth){if(growth==null||groupGrowth==null)return {flag:false,text:'Chưa đủ dữ liệu QoQ'};if(groupGrowth<=0)return {flag:false,text:'VTG không tăng trưởng dương; không xét gấp 2'};return {flag:growth>=2*groupGrowth,text:growth>=2*groupGrowth?'Cảnh báo: ≥ 2 × QoQ VTG':'Dưới ngưỡng 2 × VTG'};}
function vasRows_(c){const year=Number(c.year),q=Number(c.vasQuarter||Math.ceil(Number(c.month)/3)),vtg=vasPeriod_(c,'VTG',year,q);return vasMarkets_(c).map(m=>{const a=vasPeriod_(c,m.MarketID,year,q);return {market:m,...a,alert:m.MarketID==='VTG'?{flag:false,text:'Mốc so sánh'}:vasAlert_(a.qoq,vtg.qoq)};});}
function vasChart_(c,m){const years=[Number(c.year)-2,Number(c.year)-1,Number(c.year)],series=years.map(y=>Array.from({length:4},(_,i)=>vasPeriod_(c,m.MarketID,y,i+1))),known=series.flat().map(x=>x.revenue).filter(x=>x!==null),max=Math.max(1,...known),colors=['#9aaec6','#4895ce','#245ac2'];let svg='<svg viewBox="0 0 560 270" role="img" aria-label="Doanh thu VAS theo quý '+escapeHtmlAttr_(m.ShortName)+'"><title>Doanh thu VAS '+escapeHtml_(m.ShortName)+' · nghìn USD</title>';
 for(let i=0;i<=4;i++){const y=220-i*45;svg+='<line x1="70" y1="'+y+'" x2="545" y2="'+y+'" stroke="#dce4ed"/><text x="64" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="#526476">'+mcNum_(max*i/4)+'</text>';}
 for(let q=0;q<4;q++){svg+='<text x="'+(125+q*117)+'" y="245" text-anchor="middle" font-size="13">Q'+(q+1)+'</text>';for(let y=0;y<3;y++){const r=series[y][q],x=83+q*117+y*27;if(r.revenue===null){svg+='<text x="'+(x+10)+'" y="215" text-anchor="middle" fill="#708090">—</text>';continue;}const h=r.revenue/max*180;svg+='<rect x="'+x+'" y="'+(220-h)+'" width="23" height="'+Math.max(h,1)+'" fill="'+colors[y]+'"><title>'+years[y]+' Q'+(q+1)+': '+mcNum_(r.revenue)+' nghìn USD; QoQ '+mcPct_(r.qoq)+'</title></rect>';}}
 svg+='</svg>';return '<article class="vas-card"><h3>'+escapeHtml_(m.ShortName)+' · '+escapeHtml_(m.Country||'')+'</h3><div class="vas-legend">'+years.map((y,i)=>'<span><i style="background:'+colors[i]+'"></i>'+y+'</span>').join('')+'</div>'+svg+'<div class="table-wrap"><table class="data-table"><thead><tr><th>QoQ</th><th>Q1</th><th>Q2</th><th>Q3</th><th>Q4</th></tr></thead><tbody>'+years.map((y,i)=>'<tr><th>'+y+'</th>'+series[i].map(r=>'<td>'+mcPct_(r.qoq)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div></article>';}
function vasReport_(c){const quarter=Number(c.vasQuarter||Math.ceil(Number(c.month)/3)),rows=vasRows_(c),selected=c.vasMarket||'',cards=vasMarkets_(c).filter(m=>!selected||m.MarketID===selected),years=[Number(c.year)-2,Number(c.year)];return '<div class="mc-toolbar"><label>Báo cáo<select id="mc-view">'+mcOptions_([['MONTH','Tiêu dùng tháng'],['YEAR','Tiêu dùng lũy kế'],['MARKET_REPORT','TH thị trường'],['VAS_QUARTER','VAS theo quý']],c.view)+'</select></label><label>Năm kết thúc<input id="mc-year" type="number" required min="2002" max="2100" value="'+c.year+'"></label><label>Quý<select id="vas-quarter">'+mcOptions_([1,2,3,4].map(q=>[q,'Q'+q]),quarter)+'</select></label><label>Số liệu<select id="mc-status">'+mcOptions_([['ALL','Gồm số nháp'],['FINAL','Chỉ đã chốt']],c.status)+'</select></label></div><h2>Báo cáo VAS theo quý</h2><p>Q'+quarter+'/'+c.year+' · Doanh thu VAS và TDG: <strong>nghìn USD</strong>. Quý theo năm dương lịch.</p><button class="secondary-btn" data-action="mc-vas-export">Xuất CSV VAS</button><p class="work-context">Doanh thu lấy từ cột VAS của số thực hiện. Tỷ trọng = tổng VAS quý / tổng TDG quý. QoQ so với quý liền trước; Q1 so với Q4 năm trước. Chỉ tính khi đủ 3 tháng cho chỉ tiêu tương ứng; số 0 trong nguồn vẫn được giữ nguyên.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Đơn vị</th><th>Doanh thu VAS</th><th>TDG</th><th>VAS / TDG</th><th>VAS quý trước</th><th>QoQ</th><th>Cảnh báo</th><th>Dữ liệu</th></tr></thead><tbody>'+rows.map(r=>'<tr class="'+(r.alert.flag?'vas-alert':'')+'"><th>'+escapeHtml_(r.market.ShortName)+'</th><td>'+mcNum_(r.revenue)+'</td><td>'+mcNum_(r.total)+'</td><td>'+mcPct_(r.share)+'</td><td>'+mcNum_(r.previous)+'</td><td>'+mcPct_(r.qoq)+'</td><td>'+r.alert.text+'</td><td>'+r.count+'/3 tháng'+(r.draft?' · Nháp':'')+(r.mismatch?' · Cơ cấu chưa khớp':'')+'</td></tr>').join('')+'</tbody></table></div><p class="work-context">Cảnh báo khi QoQ nhà mạng ≥ 2 × QoQ VTG và QoQ VTG > 0. Mẫu số quý trước bằng 0 hoặc thiếu dữ liệu: không tính QoQ. VTG dùng số gốc riêng, không cộng VTG vào các thị trường.</p><h2>Doanh thu theo quý · '+years[0]+'–'+years[1]+'</h2><label>Biểu đồ đơn vị<select id="vas-market">'+mcOptions_([['','VTG và tất cả thị trường'],...vasMarkets_(c).map(m=>[m.MarketID,m.ShortName])],selected)+'</select></label><p class="work-context">Mỗi nhóm Q1–Q4 so sánh 3 năm liền kề. Di chuột vào cột để xem doanh thu và QoQ. “—” là thiếu dữ liệu; thang doanh thu riêng cho từng đơn vị.</p><div class="vas-charts">'+cards.map(m=>vasChart_(c,m)).join('')+'</div>';}
function vasExport_(){const c=consumptionState_(),rows=[['Market','Year','Quarter','Unit','VAS','TDG','VAS_TDG_Percent','Previous_VAS','QoQ_Percent','Alert','Months','Draft','Mismatch']];for(let y=Number(c.year)-2;y<=Number(c.year);y++)for(let q=1;q<=4;q++)for(const r of vasRows_({...c,year:y,vasQuarter:q}))rows.push([r.market.ShortName,y,q,'USD_THOUSAND',r.revenue,r.total,r.share,r.previous,r.qoq,r.alert.text,r.count,r.draft,r.mismatch]);const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='VAS_Quarterly_'+(Number(c.year)-2)+'_'+c.year+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
</script>
