<script>
function mcVTGSource_(c,year,months,scenario){const rows=c.data.vtgRecords||[];if(months.length===12){const annual=rows.find(r=>Number(r.Year)===Number(year)&&Number(r.Month)===0&&r.Scenario===scenario&&(c.status!=='FINAL'||r.Status==='FINAL'));if(annual)return Object.assign({},annual,{count:0,annual:true,draft:annual.Status==='DRAFT',mismatch:annual.Reconciliation==='MISMATCH'});}return mcAggregate_(rows,'VTG',year,months,scenario,c.status);}
function mcVTGChildren_(c,year,months,scenario){const markets=c.data.markets.filter(m=>!['VTG','VTCM'].includes(m.ShortName)&&!String(m.ShortName).startsWith('TEST'));const rows=markets.map(m=>({market:m,value:mcAggregate_(c.data.records,m.MarketID,year,months,scenario,c.status)}));const included=rows.filter(x=>x.value.TotalAvailable!==null);const r={markets:markets.length,withData:included.length,complete:included.every(x=>x.value.complete)&&included.length>0,mismatch:included.some(x=>x.value.mismatch),draft:included.some(x=>x.value.draft),coverage:included.map(x=>x.market.MarketID).sort().join('|')};for(const k of ['Total','Voice','SMS','Data','VAS'])r[k]=rows.some(x=>x.value[k+'Available']!==null)?rows.reduce((s,x)=>s+(x.value[k+'Available']||0),0):null;r.DataShare=r.Total>0&&r.Data!==null?r.Data/r.Total*100:null;return r;}
function mcVTGPage_(c){
 const months=c.view==='MONTH'?[Number(c.month)]:Array.from({length:Number(c.month)},(_,i)=>i+1),a=mcVTGSource_(c,c.year,months,'ACTUAL'),p=mcVTGSource_(c,c.year,months,'PLAN'),prior=mcVTGSource_(c,c.year-1,months,'ACTUAL'),children=mcVTGChildren_(c,c.year,months,'ACTUAL');
 const prev=c.view==='MONTH'?mcVTGSource_(c,Number(c.month)===1?Number(c.year)-1:c.year,[Number(c.month)===1?12:Number(c.month)-1],'ACTUAL'):null;
 const delta=a.Total!=null&&a.Total!==''&&children.Total!==null?Number(a.Total)-children.Total:null;
 let html=mcToolbar_(c)+'<h2>VTG · Tổng hợp công ty mẹ</h2><p>Đơn vị: <strong>nghìn USD</strong> · '+(c.view==='MONTH'?'Tháng '+c.month:'Lũy kế T1–T'+c.month)+'/'+c.year+'</p><p class="work-context">Số VTG gốc được lưu riêng. Tổng thị trường loại VTCM và không cộng thêm VTG. Công thức VTG trong file có thể gồm VTCM; chênh lệch dưới đây là số đối chiếu, không tự điều chỉnh.</p>';
 html+='<div class="productivity-toolbar-v2"><button class="secondary-btn" data-action="mc-vtg-export">Xuất CSV VTG</button><div>'+(c.data.vtgReady?'<button class="secondary-btn" data-action="mc-import">Nhập số VTG</button> <button class="primary-btn" data-action="mc-new">+ Nhập tháng VTG</button>':'<button class="primary-btn" data-action="mc-init">Bật lưu số VTG gốc</button>')+'</div></div>';
 html+='<div class="table-wrap"><table class="data-table"><thead><tr><th>Chỉ tiêu</th><th>Giá trị</th></tr></thead><tbody>'+[['VTG gốc – thực hiện',mcNum_(a.Total)],['VTG gốc – kế hoạch',mcNum_(p.Total)],['Hoàn thành kế hoạch',mcPct_(a.Total!=null&&a.Total!==''&&p.Total>0?a.Total/p.Total*100:null)],['MoM',mcPct_(prev?mcGrowth_(a.Total,prev.Total):null)],['YoY',mcPct_(mcGrowth_(a.Total,prior.Total))],['Tổng các thị trường có dữ liệu',mcNum_(children.Total)],['VTG gốc − tổng thị trường',mcNum_(delta)],['Phạm vi dữ liệu thị trường',children.withData+'/'+children.markets+' thị trường · '+(children.complete?'đủ kỳ trong phần có dữ liệu':'còn thiếu tháng')],['Trạng thái số VTG',a.annual?'Số tổng năm gốc':a.count+'/'+months.length+' tháng'],['Đối chiếu cơ cấu VTG',a.mismatch?'⚠ Cơ cấu chưa khớp':(a.Reconciliation==='MISMATCH'?'⚠ Cơ cấu chưa khớp':'')]].map(x=>'<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>').join('')+'</tbody></table></div>';
 html+='<h3>Cơ cấu tiêu dùng</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Dịch vụ</th><th>VTG gốc</th><th>Tỷ trọng VTG</th><th>Tổng thị trường</th></tr></thead><tbody>'+['Voice','SMS','Data','VAS'].map((k,i)=>'<tr><td>'+['Thoại','SMS','Data','VAS'][i]+'</td><td>'+mcNum_(a[k])+'</td><td>'+mcPct_(a.Total>0&&a[k]!=null&&a[k]!==''?a[k]/a.Total*100:null)+'</td><td>'+mcNum_(children[k])+'</td></tr>').join('')+'</tbody></table></div>';
 html+='<h3>Đối chiếu 12 tháng · '+c.year+'</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>Tháng</th><th>VTG gốc</th><th>Tổng thị trường</th><th>Chênh lệch</th><th>Phạm vi</th></tr></thead><tbody>'+Array.from({length:12},(_,i)=>{const s=mcVTGSource_(c,c.year,[i+1],'ACTUAL'),t=mcVTGChildren_(c,c.year,[i+1],'ACTUAL');return '<tr><td>T'+(i+1)+'</td><td>'+mcNum_(s.Total)+'</td><td>'+mcNum_(t.Total)+'</td><td>'+mcNum_(s.Total!=null&&t.Total!=null?s.Total-t.Total:null)+'</td><td>'+t.withData+'/'+t.markets+' thị trường</td></tr>';}).join('')+'</tbody></table></div>';
 if(c.view==='YEAR')html+=mcVTGYears_(c);return html;
}
function mcVTGYears_(c){const years=[...new Set((c.data.vtgRecords||[]).map(r=>Number(r.Year)))].sort((a,b)=>a-b),months=Array.from({length:12},(_,i)=>i+1),values=years.map(y=>mcVTGSource_(c,y,months,'ACTUAL'));return '<h3>Thực hiện các năm · VTG gốc</h3><p class="work-context">Ưu tiên số tổng năm gốc khi có; nếu không, cộng đủ 12 tháng. Không cộng số năm với số tháng.</p><div class="table-wrap"><table class="data-table"><thead><tr><th>Chỉ tiêu</th>'+years.map(y=>'<th>'+y+'</th>').join('')+'</tr></thead><tbody>'+['Total','Voice','SMS','Data','VAS','VoiceShare','SMSShare','DataShare','VASShare'].map((k,i)=>'<tr><td>'+['Tổng','Thoại','SMS','Data','VAS','% Thoại','% SMS','% Data','% VAS'][i]+'</td>'+values.map(r=>'<td>'+(k.endsWith('Share')?mcPct_(r.Total>0&&r[k.slice(0,-5)]!=null&&r[k.slice(0,-5)]!==''?r[k.slice(0,-5)]/r.Total*100:null):mcNum_(r[k]))+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function mcVTGExport_(){const c=consumptionState_(),months=c.view==='MONTH'?[Number(c.month)]:Array.from({length:Number(c.month)},(_,i)=>i+1),a=mcVTGSource_(c,c.year,months,'ACTUAL'),p=mcVTGSource_(c,c.year,months,'PLAN'),t=mcVTGChildren_(c,c.year,months,'ACTUAL');const rows=[['Scope','Year','ThroughMonth','View','Unit','Actual','Plan','Voice','SMS','Data','VAS','MarketsWithData','MarketsInScope'],['VTG_SOURCE',c.year,c.month,c.view,'USD_THOUSAND',a.Total,p.Total,a.Voice,a.SMS,a.Data,a.VAS,'',''],['MARKET_SUM_EXCLUDING_VTCM',c.year,c.month,c.view,'USD_THOUSAND',t.Total,'',t.Voice,t.SMS,t.Data,t.VAS,t.withData,t.markets]],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='VTG_'+c.year+'_'+c.month+'.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
</script>
