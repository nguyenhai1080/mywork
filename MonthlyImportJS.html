<script>
let monthlyPayload_=null,monthlyBusy_=false;
function monthlyOpen_(){monthlyPayload_=null;showModal_('Upload KPI tháng','<p>Chọn file gốc XLSB hoặc XLSX. Kỳ lấy từ TH thi truong!A1:B1. Chỉ nhập kỳ mới; kỳ cũ giữ nguyên.</p><input id="monthly-file" type="file" accept=".xlsb,.xlsx"><p><label><input id="monthly-compare" type="checkbox"> Đối chiếu các tháng cũ trong cùng năm (chỉ cảnh báo)</label></p><p>Đọc số đã lưu trong Excel, không chạy macro hoặc cập nhật liên kết ngoài. File chỉ được đọc trên trình duyệt; gửi các chỉ tiêu của hai sheet vào hệ thống.</p><div id="monthly-result" aria-live="polite"></div>',[{label:'Đóng',close:true},{label:'Kiểm tra file',action:'monthly-preview'},{label:'Nhập kỳ mới',action:'monthly-save'}]);document.querySelector('[data-modal-action="monthly-save"]').disabled=true;document.getElementById('monthly-file').addEventListener('change',()=>{monthlyPayload_=null;document.querySelector('[data-modal-action="monthly-save"]').disabled=true;});document.getElementById('monthly-compare').addEventListener('change',()=>{monthlyPayload_=null;document.querySelector('[data-modal-action="monthly-save"]').disabled=true;});}
function monthlyShow_(p){document.getElementById('monthly-result').innerHTML='<h3>Kỳ '+p.month+'/'+p.year+'</h3><p>'+p.count+' bản ghi kỳ mới · '+p.unchanged+' bản ghi trùng khớp · '+p.skipped+' bản ghi bỏ qua.</p>'+(p.saved!==undefined?'<p><strong>Đã lưu '+p.saved+' bản ghi và đọc lại từ Sheet.</strong></p>':'')+(p.count?'<p>Kỳ mới: '+p.newRecords.map(r=>escapeHtml_(r.market)+' ('+(r.sheet==='34_MARKET_KPI'?'TH thị trường':'TD thực')+')').join(', ')+'</p>':'<p>Không có kỳ mới cần nhập. Upload lại không tạo bản ghi trùng.</p>')+'<p>'+p.differences.length+' chỉ tiêu khác dữ liệu đang lưu. Các giá trị này không bị ghi đè.</p>'+(p.differences.length?'<div class="table-wrap"><table class="data-table"><thead><tr><th>Thị trường</th><th>Kỳ</th><th>Chỉ tiêu</th><th>Hệ thống</th><th>File mới</th></tr></thead><tbody>'+p.differences.map(d=>'<tr><td>'+escapeHtml_(d.market)+'</td><td>'+d.month+'/'+d.year+'</td><td>'+escapeHtml_(d.field)+'</td><td>'+mcNum_(d.stored)+'</td><td>'+mcNum_(d.incoming)+'</td></tr>').join('')+'</tbody></table></div>':'');}
async function monthlyPreview_(){if(monthlyBusy_)return;const file=document.getElementById('monthly-file').files[0],compare=document.getElementById('monthly-compare').checked;if(!file){showToast_('Chọn file trước.','error');return;}if(file.size>50*1024*1024){showToast_('File vượt 50 MB.','error');return;}monthlyBusy_=true;monthlyPayload_=null;setModalBusy_(true,'Đang kiểm tra...');try{const data=await file.arrayBuffer(),names=XLSX.read(data,{bookSheets:true}).SheetNames;if(!names.includes('TD thuc')||!names.includes('TH thi truong'))throw Error('Thiếu sheet nguồn.');const wb=XLSX.read(data,{sheets:['TD thuc','TH thi truong'],cellFormula:false,cellHTML:false,cellStyles:false}),payload=monthlyExtract_(wb,file.name,compare),preview=await serverCall_('apiPreviewMonthlyWorkbook',payload);monthlyPayload_=payload;monthlyShow_(preview);setModalBusy_(false);document.querySelector('[data-modal-action="monthly-save"]').disabled=!preview.count;}catch(e){setModalBusy_(false);document.querySelector('[data-modal-action="monthly-save"]').disabled=true;document.getElementById('monthly-result').textContent=e.message;showToast_(e.message,'error');}finally{monthlyBusy_=false;}}
async function monthlySave_(){if(monthlyBusy_||!monthlyPayload_)return;monthlyBusy_=true;setModalBusy_(true,'Đang nhập kỳ mới...');try{const r=await serverCall_('apiImportMonthlyWorkbook',monthlyPayload_);monthlyShow_(r);monthlyPayload_=null;await loadConsumption_();setModalBusy_(false);document.querySelector('[data-modal-action="monthly-save"]').disabled=true;showToast_('Đã xử lý '+r.saved+' bản ghi kỳ mới.','success');}catch(e){setModalBusy_(false);document.getElementById('monthly-result').textContent='Chưa xác nhận hoàn tất. Bấm Kiểm tra file để đối chiếu trước khi thử lại. '+e.message;monthlyPayload_=null;document.querySelector('[data-modal-action="monthly-save"]').disabled=true;showToast_(e.message,'error');}finally{monthlyBusy_=false;}}
</script>
